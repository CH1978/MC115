<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 照片流體牆</title>
<style>
  html{ background:#0a0f1a; }
  body{
    margin:0; padding:0; overflow:hidden;
    background:radial-gradient(ellipse at center, #16223a 0%, #0a0f1a 100%);
    font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    color:#e6edf6;
    min-height:100vh;
  }
  #canvas-wrap{ position:fixed; inset:0; }
  canvas{ display:block; }

  .header{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    z-index:10; text-align:center; pointer-events:none;
  }
  .header h1{ margin:0; font-size:1.5rem; letter-spacing:2px;
    text-shadow:0 3px 20px rgba(0,0,0,.8); color:#e6edf6; }
  .header p{ margin:6px 0 0; font-size:.85rem; opacity:.6; color:#93a2b8; }

  .controls{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    z-index:10; display:flex; gap:10px; align-items:center;
    background:rgba(15,25,45,.7);
    border:1px solid rgba(74,144,226,.25);
    border-radius:14px; padding:10px 16px;
    backdrop-filter:blur(14px);
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    flex-wrap:wrap; justify-content:center;
    max-width:calc(100vw - 40px);
  }
  .btn{
    background:transparent; border:1px solid rgba(74,144,226,.35);
    color:#e6edf6; padding:8px 14px; border-radius:8px;
    font-size:.85rem; font-family:inherit;
    cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .btn:hover{ background:#4a90e2; border-color:#4a90e2; }
  .btn.active{ background:#4a90e2; border-color:#4a90e2; }
  .divider{ width:1px; height:22px; background:rgba(74,144,226,.25); }

  .loading{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(10,15,26,.95); z-index:100; transition:opacity .4s;
  }
  .loading.hide{ opacity:0; pointer-events:none; }
  .spinner{
    width:50px; height:50px;
    border:3px solid rgba(74,144,226,.2); border-top-color:#4a90e2;
    border-radius:50%; animation:spin 1s linear infinite; margin-bottom:20px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{ font-size:.95rem; color:#93a2b8; }

  .hint{
    position:fixed; top:20px; right:20px; z-index:10;
    background:rgba(15,25,45,.7); border:1px solid rgba(74,144,226,.25);
    border-radius:10px; padding:12px 16px;
    font-size:.8rem; color:#93a2b8; line-height:1.7;
    backdrop-filter:blur(8px);
  }
  .hint kbd{
    background:rgba(74,144,226,.15); border:1px solid rgba(74,144,226,.35);
    border-radius:4px; padding:1px 6px;
    color:#e6edf6; font-family:inherit; font-size:.75rem;
  }

  .stats{
    position:fixed; top:20px; left:20px; z-index:10;
    background:rgba(15,25,45,.6); border:1px solid rgba(74,144,226,.2);
    border-radius:8px; padding:8px 12px;
    font-size:.72rem; color:#93a2b8;
    font-family:monospace; line-height:1.5;
    backdrop-filter:blur(6px); pointer-events:none;
  }
  .stats b{ color:#4a90e2; }
  .stats .ok{ color:#4caf50; }
  .stats .err{ color:#e05c5c; }

  @media(max-width:600px){
    .hint, .stats{ display:none; }
    .header h1{ font-size:1.1rem; }
    .controls{ padding:8px 8px; gap:5px; bottom:12px; }
    .btn{ padding:6px 10px; font-size:.72rem; }
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div class="header">
  <h1>🌊 3D 照片流體牆</h1>
  <p>照片隨機流動漂浮 · 點一張飛到前面</p>
</div>

<div class="hint">
  <kbd>拖曳</kbd> 環繞視角<br>
  <kbd>滾輪</kbd> 拉近拉遠<br>
  <kbd>點照片</kbd> 飛到前面
</div>

<div class="stats">
  FPS <b id="fps">—</b> · 照片 <b id="photoCount">0</b> · 成功 <b id="okCount" class="ok">0</b> · 失敗 <b id="failCount" class="err">0</b>
</div>

<div class="controls">
  <button class="btn" id="layoutBtn">🔄 格狀</button>
  <button class="btn" id="speedBtn">🌊 中</button>
  <div class="divider"></div>
  <button class="btn active" id="autoBtn">⏸ 停止環繞</button>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">正在載入照片...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/* ==================================================================
   設定區
   ================================================================== */
const CONFIG = {
  driveFolderId : "1VAV1XOHmAUsJTKMZOKJ3c2kejxEhGvNg",
  driveApiKey   : "AIzaSyB910ZgThT9GLBzID31DTceu85W4ndtldY",
  photoW: 4, photoH: 3, gap: 1.2, maxPerRow: 4,
  flowAmp: 4.5, flowSpeed: 1.0,
  autoSpeed: 0.4, focusDist: 14,
};

const PHOTO_URL_FORMAT = id => `https://lh3.googleusercontent.com/d/${id}=s1600`;

let scene, camera, renderer;
let photos = [], cards = [];
let ambientParticles = null, particleUniforms = null;
let autoRotate = true, reducedMotion = false;

let layouts = ['grid', 'sphere', 'spiral', 'cloud', 'random'];
let layoutNames = { grid:'格狀', sphere:'球體', spiral:'螺旋', cloud:'雲霧', random:'隨機' };
let currentLayout = 0;

let flowSpeedNames = ['慢', '中', '快'];
let flowSpeedMul = [0.5, 1.0, 2.0];
let flowSpeedIdx = 1;

let rotationX = 0.1, rotationY = 0;
let targetRotationX = 0.1, targetRotationY = 0;
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let raycaster, mouse;
let cameraTargetZ = 45, cameraCurrentZ = 45;
let focusedCard = null, hoveredCard = null;
let clock;
let fpsEl, photoCountEl, okCountEl, failCountEl;
let frameCount = 0, fpsTimer = 0;
let successCount = 0, failCount = 0;
let lastHoverCheck = 0;
const HOVER_INTERVAL = 50;

const keepAliveImages = [];

const _v1 = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const _v3 = new THREE.Vector3();
const _quat = new THREE.Quaternion();
const _mat4 = new THREE.Matrix4();

function damp(current, target, lambda, dt){
  return current + (target - current) * (1 - Math.exp(-lambda * dt));
}
function dampVec(vec, target, lambda, dt){
  vec.x = damp(vec.x, target.x, lambda, dt);
  vec.y = damp(vec.y, target.y, lambda, dt);
  vec.z = damp(vec.z, target.z, lambda, dt);
}

/* ==================================================================
   載入 Texture
   ================================================================== */
async function loadTextureFromUrl(url){
  const res = await fetch(url, { mode: 'cors' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const blob = await res.blob();

  const bitmap = await createImageBitmap(blob);
  keepAliveImages.push(bitmap);

  const SIZE = 512;
  const canvas = document.createElement('canvas');
  canvas.width = SIZE;
  canvas.height = SIZE;
  const ctx = canvas.getContext('2d');

  const imgAspect = bitmap.width / bitmap.height;
  let sx = 0, sy = 0, sw = bitmap.width, sh = bitmap.height;
  if(imgAspect > 1){
    sw = bitmap.height;
    sx = (bitmap.width - sw) / 2;
  } else {
    sh = bitmap.width;
    sy = (bitmap.height - sh) / 2;
  }
  ctx.drawImage(bitmap, sx, sy, sw, sh, 0, 0, SIZE, SIZE);

  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.flipY = true;
  return tex;
}

/* ==================================================================
   初始化 3D
   ================================================================== */
function initThree(){
  reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reducedMotion) autoRotate = false;

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0f1a, 0.010);

  const w = window.innerWidth;
  const h = window.innerHeight;

  camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 500);
  camera.position.set(0, 5, cameraTargetZ);

  renderer = new THREE.WebGLRenderer({
    antialias: true, alpha: true, powerPreference: 'high-performance',
  });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0a0f1a, 0);
  document.getElementById('canvas-wrap').appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.95));
  const light1 = new THREE.DirectionalLight(0xffffff, 0.7);
  light1.position.set(15, 20, 15);
  scene.add(light1);

  createAmbientParticles();

  clock = new THREE.Clock();
  clock.getDelta();

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  setupControls();
  animate();
}

function createAmbientParticles(){
  const count = 400;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const phases = new Float32Array(count);

  for(let i = 0; i < count; i++){
    positions[i*3]   = (Math.random() - 0.5) * 90;
    positions[i*3+1] = (Math.random() - 0.5) * 60;
    positions[i*3+2] = (Math.random() - 0.5) * 90;

    const r = Math.random();
    if(r < 0.5){ colors[i*3] = 0.29; colors[i*3+1] = 0.56; colors[i*3+2] = 0.24; }
    else if(r < 0.85){ colors[i*3] = 0.29; colors[i*3+1] = 0.56; colors[i*3+2] = 0.88; }
    else { colors[i*3] = 0.94; colors[i*3+1] = 0.78; colors[i*3+2] = 0.25; }

    phases[i] = Math.random() * Math.PI * 2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

  particleUniforms = {
    uTime: { value: 0 },
    uSize: { value: 4.0 * renderer.getPixelRatio() },
  };

  const mat = new THREE.ShaderMaterial({
    uniforms: particleUniforms,
    vertexShader: `
      uniform float uTime; uniform float uSize;
      attribute vec3 aColor; attribute float aPhase;
      varying vec3 vColor;
      void main(){
        vColor = aColor;
        vec3 pos = position;
        pos.x += sin(uTime * 0.3 + aPhase) * 2.5;
        pos.y += cos(uTime * 0.25 + aPhase * 1.3) * 2.5;
        pos.z += sin(uTime * 0.35 + aPhase * 0.8) * 2.5;
        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = uSize * (300.0 / -mvPos.z);
        gl_Position = projectionMatrix * mvPos;
      }`,
    fragmentShader: `
      varying vec3 vColor;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        if(d > 0.5) discard;
        float alpha = smoothstep(0.5, 0.0, d) * 0.7;
        gl_FragColor = vec4(vColor, alpha);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });

  ambientParticles = new THREE.Points(geo, mat);
  scene.add(ambientParticles);
}

function setupControls(){
  const wrap = document.getElementById('canvas-wrap');

  wrap.addEventListener('mousedown', e => {
    isDragging = true;
    prevMouse = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('mousemove', e => {
    if(!isDragging){
      const now = performance.now();
      if(now - lastHoverCheck < HOVER_INTERVAL) return;
      lastHoverCheck = now;
      updateHover(e);
    } else {
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      targetRotationY += dx * 0.006;
      targetRotationX += dy * 0.006;
      targetRotationX = Math.max(-1.0, Math.min(1.0, targetRotationX));
      prevMouse = { x: e.clientX, y: e.clientY };
    }
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  wrap.addEventListener('touchstart', e => {
    if(e.touches.length === 1){
      isDragging = true;
      prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    if(!isDragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - prevMouse.x;
    const dy = e.touches[0].clientY - prevMouse.y;
    targetRotationY += dx * 0.008;
    targetRotationX += dy * 0.008;
    targetRotationX = Math.max(-1.0, Math.min(1.0, targetRotationX));
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  wrap.addEventListener('touchend', () => { isDragging = false; });

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    if(focusedCard) return;
    cameraTargetZ += e.deltaY * 0.03;
    cameraTargetZ = Math.max(18, Math.min(110, cameraTargetZ));
  }, { passive: false });

  wrap.addEventListener('click', e => {
    if(isDragging) return;
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const hits = raycaster.intersectObjects(cards);
    if(hits.length > 0){
      const card = hits[0].object;
      if(focusedCard === card) unfocusCard();
      else focusCard(card);
    } else {
      if(focusedCard) unfocusCard();
    }
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && focusedCard) unfocusCard();
  });
}

function updateHover(e){
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(cards);
  const newHover = hits.length > 0 ? hits[0].object : null;
  if(newHover !== hoveredCard){
    hoveredCard = newHover;
    renderer.domElement.style.cursor = hoveredCard ? 'pointer' : (isDragging ? 'grabbing' : 'grab');
  }
}

function focusCard(card){ if(focusedCard) unfocusCard(); focusedCard = card; card.userData.focused = true; }
function unfocusCard(){ if(!focusedCard) return; focusedCard.userData.focused = false; focusedCard = null; }

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  if(autoRotate && !isDragging && !focusedCard && !reducedMotion){
    targetRotationY += CONFIG.autoSpeed * dt;
  }

  rotationX = damp(rotationX, targetRotationX, 10, dt);
  rotationY = damp(rotationY, targetRotationY, 10, dt);
  cameraCurrentZ = damp(cameraCurrentZ, cameraTargetZ, 10, dt);

  const radius = cameraCurrentZ;
  const cosX = Math.cos(rotationX);
  camera.position.x = Math.sin(rotationY) * cosX * radius;
  camera.position.z = Math.cos(rotationY) * cosX * radius;
  camera.position.y = Math.sin(rotationX) * radius + 3;
  camera.lookAt(0, 0, 0);

  if(particleUniforms) particleUniforms.uTime.value = t;

  const globalSpeed = CONFIG.flowSpeed * flowSpeedMul[flowSpeedIdx];
  const globalAmp = CONFIG.flowAmp;
  const noiseTime = t * 0.3 * globalSpeed;

  for(let i = 0; i < cards.length; i++){
    const card = cards[i];
    const fd = card.userData.flowData;
    const homePos = card.userData.homePos;

    if(card === focusedCard){
      const camDir = _v1;
      camera.getWorldDirection(camDir);
      const targetPos = _v2;
      targetPos.copy(camera.position).addScaledVector(camDir, CONFIG.focusDist);
      dampVec(card.position, targetPos, 8, dt);

      _mat4.lookAt(camera.position, card.position, camera.up);
      _quat.setFromRotationMatrix(_mat4);
      card.quaternion.slerp(_quat, 1 - Math.exp(-10 * dt));
      const s = damp(card.scale.x, 1.6, 8, dt);
      card.scale.set(s, s, s);
      card.renderOrder = 999;
      card.material.opacity = 1;
    } else {
      const nx = noise3D(homePos.x * 0.08 + fd.offsetX, homePos.y * 0.08 + fd.offsetY, noiseTime + fd.timeOffset);
      const ny = noise3D(homePos.x * 0.08 + fd.offsetX + 100, homePos.y * 0.08 + fd.offsetY + 100, noiseTime + fd.timeOffset + 50);
      const nz = noise3D(homePos.x * 0.08 + fd.offsetX + 200, homePos.y * 0.08 + fd.offsetY + 200, noiseTime + fd.timeOffset + 150);

      const fx = nx * fd.ampMul * globalAmp;
      const fy = ny * fd.ampMul * globalAmp;
      const fz = nz * fd.ampMul * globalAmp * 0.7;

      const targetPos = _v3;
      targetPos.set(homePos.x + fx, homePos.y + fy, homePos.z + fz);
      dampVec(card.position, targetPos, 5, dt);

      _mat4.lookAt(camera.position, card.position, camera.up);
      _quat.setFromRotationMatrix(_mat4);
      card.quaternion.slerp(_quat, 1 - Math.exp(-8 * dt));

      const targetScale = (card === hoveredCard) ? 1.15 : 1;
      const s = damp(card.scale.x, targetScale, 10, dt);
      card.scale.set(s, s, s);
      card.renderOrder = 0;
      card.material.opacity = (card === hoveredCard) ? 1 : 0.92;
    }
  }

  renderer.render(scene, camera);

  frameCount++;
  fpsTimer += dt;
  if(fpsTimer >= 0.5){
    if(fpsEl) fpsEl.textContent = Math.round(frameCount / fpsTimer);
    frameCount = 0; fpsTimer = 0;
  }
}

/* ==================================================================
   Noise
   ================================================================== */
function hash3(x, y, z){
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (z | 0) * 1442695040;
  h = (h ^ (h >> 13)) * 1274126177;
  h = h ^ (h >> 16);
  return (h & 0x7fffffff) / 0x7fffffff;
}
function fade(t){ return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(a, b, t){ return a + t * (b - a); }
function noise3D(x, y, z){
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const ux = fade(fx), uy = fade(fy), uz = fade(fz);
  const n000 = hash3(ix, iy, iz), n100 = hash3(ix+1, iy, iz);
  const n010 = hash3(ix, iy+1, iz), n110 = hash3(ix+1, iy+1, iz);
  const n001 = hash3(ix, iy, iz+1), n101 = hash3(ix+1, iy, iz+1);
  const n011 = hash3(ix, iy+1, iz+1), n111 = hash3(ix+1, iy+1, iz+1);
  const nx00 = lerp(n000, n100, ux), nx10 = lerp(n010, n110, ux);
  const nx01 = lerp(n001, n101, ux), nx11 = lerp(n011, n111, ux);
  const nxy0 = lerp(nx00, nx10, uy), nxy1 = lerp(nx01, nx11, uy);
  return lerp(nxy0, nxy1, uz) * 2 - 1;
}

/* ==================================================================
   從 Drive 載入
   ================================================================== */
async function loadPhotosFromDrive(){
  const q = encodeURIComponent(`'${CONFIG.driveFolderId}' in parents and mimeType contains 'image/' and trashed = false`);
  const url = `https://www.googleapis.com/drive/v3/files?q=${q}&key=${CONFIG.driveApiKey}&fields=files(id,name)&orderBy=createdTime desc&pageSize=100`;
  const res = await fetch(url);
  const data = await res.json();
  if(!data.files || data.files.length === 0) throw new Error('資料夾裡沒有照片');
  return data.files;
}

function makeFlowData(){
  const rand = (min, max) => min + Math.random() * (max - min);
  return {
    offsetX: rand(-1000, 1000),
    offsetY: rand(-1000, 1000),
    timeOffset: rand(0, 1000),
    ampMul: rand(0.5, 1.8),
  };
}

/* ==================================================================
   建立照片卡
   ================================================================== */
function createPhotoCard(photo, index){
  const W = CONFIG.photoW;
  const H = CONFIG.photoH;

  const geo = new THREE.PlaneGeometry(W, H);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x1a2030,
    side: THREE.FrontSide,
  });

  const card = new THREE.Mesh(geo, mat);
  card.userData.isPhotoCard = true;
  card.userData.photo = photo;
  card.userData.index = index;
  card.userData.focused = false;
  card.userData.flowData = makeFlowData();

  const frameGeo = new THREE.BoxGeometry(W + 0.15, H + 0.15, 0.06);
  const frameMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const frame = new THREE.Mesh(frameGeo, frameMat);
  frame.position.z = -0.05;
  card.add(frame);

  const url = PHOTO_URL_FORMAT(photo.id);

  loadTextureFromUrl(url)
    .then(texture => {
      const newMat = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.FrontSide,
      });
      card.material.dispose();
      card.material = newMat;
      card.material.needsUpdate = true;

      successCount++;
      if(okCountEl) okCountEl.textContent = successCount;
      renderer.render(scene, camera);
    })
    .catch(err => {
      failCount++;
      if(failCountEl) failCountEl.textContent = failCount;
    });

  return card;
}

/* ==================================================================
   排列
   ================================================================== */
function layoutGrid(n){
  const W = CONFIG.photoW, H = CONFIG.photoH, GAP = CONFIG.gap;
  const spX = W + GAP, spY = H + GAP;
  const perRow = Math.min(CONFIG.maxPerRow, Math.ceil(Math.sqrt(n)));
  const rows = Math.ceil(n / perRow);
  const positions = [];
  for(let i = 0; i < n; i++){
    const row = Math.floor(i / perRow), col = i % perRow;
    positions.push(new THREE.Vector3(
      (col - (perRow - 1) / 2) * spX,
      -((row - (rows - 1) / 2) * spY),
      0
    ));
  }
  return positions;
}
function layoutSphere(n){
  const radius = Math.max(12, n * 1.2);
  const positions = [];
  for(let i = 0; i < n; i++){
    const phi = Math.acos(1 - 2 * (i + 0.5) / n);
    const theta = Math.PI * (1 + Math.sqrt(5)) * i;
    positions.push(new THREE.Vector3(
      Math.sin(phi) * Math.cos(theta) * radius,
      Math.cos(phi) * radius,
      Math.sin(phi) * Math.sin(theta) * radius
    ));
  }
  return positions;
}
function layoutSpiral(n){
  const positions = [];
  const turns = 3;
  for(let i = 0; i < n; i++){
    const t = i / n;
    const angle = t * Math.PI * 2 * turns;
    const r = 4 + t * 16;
    const y = (t - 0.5) * 26;
    positions.push(new THREE.Vector3(Math.sin(angle) * r, y, Math.cos(angle) * r));
  }
  return positions;
}
function layoutCloud(n){
  const positions = [];
  for(let i = 0; i < n; i++){
    const r = 8 + Math.random() * 12;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI;
    positions.push(new THREE.Vector3(
      Math.sin(phi) * Math.cos(theta) * r,
      Math.cos(phi) * r * 0.6,
      Math.sin(phi) * Math.sin(theta) * r
    ));
  }
  return positions;
}
function layoutRandom(n){
  const positions = [];
  const radius = Math.max(12, n * 1.0);
  for(let i = 0; i < n; i++){
    const r = radius * Math.cbrt(Math.random());
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions.push(new THREE.Vector3(
      Math.sin(phi) * Math.cos(theta) * r,
      Math.cos(phi) * r * 0.7,
      Math.sin(phi) * Math.sin(theta) * r
    ));
  }
  return positions;
}

function applyLayout(name){
  if(cards.length === 0) return;
  const n = cards.length;
  let positions;
  switch(name){
    case 'sphere': positions = layoutSphere(n); break;
    case 'spiral': positions = layoutSpiral(n); break;
    case 'cloud':  positions = layoutCloud(n);  break;
    case 'random': positions = layoutRandom(n); break;
    default:       positions = layoutGrid(n);   break;
  }
  for(let i = 0; i < cards.length; i++) cards[i].userData.homePos = positions[i];
  unfocusCard();
  let maxDim = 0;
  for(const p of positions) maxDim = Math.max(maxDim, Math.abs(p.x), Math.abs(p.y), Math.abs(p.z));
  cameraTargetZ = Math.max(28, maxDim * 2.2);
}

async function buildAllCards(){
  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loadingText');

  loadingText.textContent = `建立 ${photos.length} 張照片...`;

  for(const c of cards){
    scene.remove(c);
    c.geometry.dispose();
    if(c.material.map) c.material.map.dispose();
    c.material.dispose();
    for(const child of c.children){
      if(child.geometry) child.geometry.dispose();
      if(child.material) child.material.dispose();
    }
  }
  cards.length = 0;
  successCount = 0;
  failCount = 0;
  if(okCountEl) okCountEl.textContent = 0;
  if(failCountEl) failCountEl.textContent = 0;

  for(let i = 0; i < photos.length; i++){
    const card = createPhotoCard(photos[i], i);
    scene.add(card);
    cards.push(card);
  }

  applyLayout(layouts[currentLayout]);

  if(photoCountEl) photoCountEl.textContent = photos.length;

  setTimeout(() => loading.classList.add('hide'), 1500);
}

/* ==================================================================
   初始化
   ================================================================== */
(async function init(){
  initThree();

  fpsEl = document.getElementById('fps');
  photoCountEl = document.getElementById('photoCount');
  okCountEl = document.getElementById('okCount');
  failCountEl = document.getElementById('failCount');

  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loadingText');
  loadingText.textContent = '正在從 Google Drive 載入照片清單...';

  try {
    photos = await loadPhotosFromDrive();
    if(photos.length === 0) throw new Error('沒有照片');
    await buildAllCards();
  } catch(e) {
    console.error(e);
    loadingText.textContent = '❌ ' + e.message;
    setTimeout(() => loading.classList.add('hide'), 2500);
  }

  const layoutBtn = document.getElementById('layoutBtn');
  layoutBtn.textContent = '🔄 ' + layoutNames[layouts[currentLayout]];
  layoutBtn.addEventListener('click', () => {
    currentLayout = (currentLayout + 1) % layouts.length;
    applyLayout(layouts[currentLayout]);
    layoutBtn.textContent = '🔄 ' + layoutNames[layouts[currentLayout]];
  });

  const speedBtn = document.getElementById('speedBtn');
  speedBtn.textContent = '🌊 ' + flowSpeedNames[flowSpeedIdx];
  speedBtn.addEventListener('click', () => {
    flowSpeedIdx = (flowSpeedIdx + 1) % flowSpeedNames.length;
    speedBtn.textContent = '🌊 ' + flowSpeedNames[flowSpeedIdx];
  });

  const autoBtn = document.getElementById('autoBtn');
  if(reducedMotion){ autoBtn.textContent = '▶ 自動環繞'; autoBtn.classList.remove('active'); }
  autoBtn.addEventListener('click', () => {
    autoRotate = !autoRotate;
    autoBtn.textContent = autoRotate ? '⏸ 停止環繞' : '▶ 自動環繞';
    autoBtn.classList.toggle('active', autoRotate);
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if(particleUniforms) particleUniforms.uSize.value = 4.0 * renderer.getPixelRatio();
  });

  document.addEventListener('visibilitychange', () => {
    if(document.hidden) clock.stop(); else clock.start();
  });
})();
</script>
