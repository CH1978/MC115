<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft 遊戲說明 ｜ Minecraft Game Guide</title>
<style>
:root{
  --bg:#0e1420; --panel:#151d2c; --elev:#1e283c; --border:#2a3852;
  --text:#e6edf6; --muted:#93a2b8; --dim:#5b6b85;
  --green:#4a8f3c; --green-d:#356a2b; --accent:#4a90e2; --warm:#f0c840;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:14px;line-height:1.6;}
img{max-width:100%;display:block;}

/* 頂部 */
.topbar{background:linear-gradient(135deg,#0e1420,#1a2844);
  border-bottom:1px solid var(--border);padding:8px 16px;
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar .logo{width:34px;height:34px;background:var(--green);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.topbar .title{flex:1;min-width:0;}
.topbar .title h1{margin:0;font-size:.92rem;font-weight:700;}
.topbar .title .en{font-size:.72rem;color:var(--muted);font-weight:500;}
.voice-mode{display:flex;background:var(--elev);border:1px solid var(--border);
  border-radius:7px;padding:2px;gap:1px;flex-shrink:0;}
.voice-mode button{background:transparent;border:none;color:var(--muted);
  padding:5px 10px;border-radius:5px;cursor:pointer;font-family:inherit;
  font-size:.72rem;font-weight:600;}
.voice-mode button.active{background:var(--accent);color:#fff;}
#startBtn{background:var(--green);border:none;color:#fff;
  padding:7px 14px;border-radius:7px;font-weight:700;font-size:.78rem;
  cursor:pointer;font-family:inherit;flex-shrink:0;}
#startBtn.on{background:#a04a4a;}

/* 版面 */
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 52px);}
.sidebar{background:var(--panel);border-right:1px solid var(--border);
  padding:16px 12px;overflow-y:auto;position:sticky;top:52px;
  height:calc(100vh - 52px);}
.sidebar-group-title{font-size:.7rem;color:var(--dim);letter-spacing:1.5px;
  text-transform:uppercase;font-weight:700;padding:10px 10px 6px;}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:9px 12px;
  border-radius:8px;cursor:pointer;font-family:inherit;
  font-size:.83rem;font-weight:600;color:var(--muted);
  background:transparent;border:none;width:100%;text-align:left;
  margin-bottom:2px;transition:.15s;}
.sidebar-item:hover{background:var(--elev);color:var(--text);}
.sidebar-item.active{background:var(--accent);color:#fff;}
.sidebar-item .ico{font-size:1rem;flex-shrink:0;width:20px;text-align:center;}
.sidebar-item .num{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--border);
  color:var(--text);font-size:.7rem;font-weight:800;flex-shrink:0;}
.sidebar-item.active .num{background:rgba(255,255,255,.3);color:#fff;}
.sidebar-sub{padding-left:30px;font-size:.8rem;padding:7px 12px 7px 30px;}
.sidebar-sub .num{width:20px;height:20px;font-size:.65rem;}

/* 內容 */
.main-content{padding:24px 28px 180px;max-width:1100px;scroll-behavior:smooth;}
.unit-header{margin-bottom:18px;}
.unit-header .badge{display:inline-block;background:var(--accent);color:#fff;
  padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;margin-bottom:8px;}
.unit-header h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;color:var(--warm);}

.section{background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:20px;margin-bottom:14px;
  transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;}
.section.focused{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent), 0 0 32px rgba(74,144,226,.35);
  transform:scale(1.008);
}
.section.focused h3::before{
  background:var(--warm);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(240,200,64,.6); }
  50%{ box-shadow:0 0 0 8px rgba(240,200,64,0); }
}

.section h3{margin:0 0 12px;font-size:1rem;color:var(--accent);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.section h3::before{content:"";width:4px;height:18px;background:var(--accent);
  border-radius:2px;transition:.3s;}
.section p{margin:8px 0;font-size:.9rem;}
.section .tip{background:var(--elev);border-left:3px solid var(--green);
  padding:10px 14px;border-radius:6px;margin:12px 0;font-size:.85rem;}
.section .warn{background:#3a2020;border-left:3px solid #c0392b;
  padding:10px 14px;border-radius:6px;margin:12px 0;font-size:.85rem;color:#ffcccc;}

.data-table{width:100%;border-collapse:collapse;background:var(--elev);
  border-radius:8px;overflow:hidden;margin:12px 0;font-size:.85rem;}
.data-table th{background:var(--border);color:var(--text);padding:8px 10px;
  text-align:left;font-size:.78rem;font-weight:700;}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--border);}
.data-table .key{background:var(--bg);color:var(--warm);font-family:monospace;
  font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;font-size:.8rem;}

.kb-vis{display:inline-grid;gap:3px;margin:12px 0;}
.kb-row{display:flex;gap:3px;justify-content:center;}
.kb-key{background:var(--elev);border:1px solid var(--border);
  border-radius:4px;padding:6px 10px;font-size:.75rem;font-weight:700;
  color:var(--text);min-width:32px;text-align:center;}
.kb-key.hl{background:var(--accent);color:#fff;border-color:var(--accent);}

.mouse-vis{display:inline-block;margin:14px 0;text-align:center;}
.mouse-body{width:80px;height:130px;background:var(--elev);
  border:2px solid var(--border);border-radius:40px 40px 30px 30px;
  position:relative;margin:0 auto;}
.mouse-btn-l,.mouse-btn-r{position:absolute;top:0;width:38px;height:50px;
  border-bottom:1px solid var(--border);}
.mouse-btn-l{left:0;border-right:1px solid var(--border);
  border-radius:40px 0 0 0;background:rgba(74,144,226,.3);}
.mouse-btn-r{right:0;border-radius:0 40px 0 0;background:rgba(74,143,60,.3);}
.mouse-wheel{position:absolute;top:20px;left:50%;transform:translateX(-50%);
  width:8px;height:24px;background:var(--warm);border-radius:4px;}
.mouse-label{margin-top:10px;font-size:.8rem;color:var(--muted);}
.mouse-label span{display:inline-block;margin:0 4px;padding:2px 8px;
  border-radius:4px;font-size:.72rem;font-weight:700;}
.mouse-label .l{background:rgba(74,144,226,.3);color:#9cc4f0;}
.mouse-label .r{background:rgba(74,143,60,.3);color:#a0d090;}
.mouse-label .w{background:rgba(240,200,64,.3);color:#f0d070;}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;margin:12px 0;}
.mini-card{background:var(--elev);border:1px solid var(--border);
  border-radius:8px;padding:12px;text-align:center;}
.mini-card .ico{font-size:1.8rem;}
.mini-card .t{font-weight:700;font-size:.8rem;margin-top:4px;}
.mini-card .s{font-size:.7rem;color:var(--muted);margin-top:2px;}

.img-block{margin:14px 0;}
.img-block img{width:100%; border-radius:10px; display:block; margin-bottom:10px;}
.img-slot{background:linear-gradient(135deg,#1a1f2e,#131a28);
  border:2px dashed #4a5878;border-radius:10px;padding:16px 18px;position:relative;}
.img-slot .img-num{position:absolute;top:-10px;left:14px;
  background:var(--warm);color:#1a1a1a;padding:2px 10px;border-radius:12px;
  font-size:.72rem;font-weight:800;}
.img-slot .img-name{font-family:monospace;font-size:.78rem;color:var(--accent);
  margin:6px 0 8px;padding:4px 10px;background:rgba(74,144,226,.12);
  border-radius:5px;display:inline-block;}
.img-slot .img-desc{font-size:.85rem;line-height:1.6;}
.img-slot .img-desc b{color:var(--warm);}
.img-slot .img-desc .script{
  margin-top:8px; padding:8px 12px; background:rgba(240,200,64,.1);
  border-left:2px solid var(--warm); border-radius:4px;
  font-size:.82rem; color:#ffe9a0; font-style:italic;}
.img-slot .img-desc .script::before{content:"🎙️ 「"; color:var(--warm); font-style:normal;}
.img-slot .img-desc .script::after{content:"」"; color:var(--warm); font-style:normal;}

.step-list{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.step-item{display:flex;align-items:flex-start;gap:10px;
  background:var(--elev);border-radius:8px;padding:10px 14px;}
.step-item .sn{display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;background:var(--accent);
  color:#fff;font-size:.72rem;font-weight:800;flex-shrink:0;margin-top:2px;}
.step-item .st{flex:1;font-size:.88rem;}

.checklist{background:linear-gradient(135deg,rgba(74,143,60,.15),rgba(74,143,60,.05));
  border:1px solid var(--green);border-radius:10px;padding:14px 18px;margin:14px 0;}
.checklist h4{margin:0 0 10px;font-size:.9rem;color:#a0d090;}
.checklist label{display:flex;align-items:flex-start;gap:8px;padding:5px 0;
  font-size:.88rem;cursor:pointer;}
.checklist input[type=checkbox]{margin-top:5px;accent-color:var(--green);width:16px;height:16px;}

.faq{margin:14px 0;}
.faq-item{background:var(--elev);border-radius:8px;padding:12px 16px;margin-bottom:8px;}
.faq-item .q{font-weight:700;color:var(--warm);margin-bottom:6px;font-size:.88rem;}
.faq-item .a{font-size:.85rem;color:var(--text);}

.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.ref-card{background:var(--elev);border:1px solid var(--border);border-radius:10px;
  padding:16px;transition:.15s;text-decoration:none;color:var(--text);display:block;}
.ref-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.ref-card .cat{font-size:.72rem;color:var(--accent);font-weight:700;margin-bottom:6px;}
.ref-card h4{margin:0 0 6px;font-size:.92rem;}
.ref-card .url{font-size:.75rem;color:var(--muted);font-family:monospace;
  word-break:break-all;margin-bottom:6px;}
.ref-card .desc{font-size:.8rem;color:var(--muted);}

.demo-bar{position:fixed;bottom:0;left:260px;right:0;background:rgba(14,20,32,.98);
  border-top:2px solid var(--accent);padding:8px 14px 10px;
  display:none;flex-direction:column;gap:6px;z-index:200;
  box-shadow:0 -6px 24px rgba(0,0,0,.6);}
.demo-bar.open{display:flex;}
.demo-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.demo-head button{background:var(--elev);border:1px solid var(--border);
  color:var(--text);padding:5px 10px;border-radius:6px;cursor:pointer;
  font-family:inherit;font-size:.78rem;font-weight:600;}
.demo-head button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.demo-head .spacer{flex:1;}
.demo-caption{font-size:.9rem;line-height:1.55;background:var(--elev);
  padding:9px 12px;border-radius:7px;border-left:3px solid var(--accent);}

#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#fff;padding:10px 20px;border-radius:7px;
  font-weight:600;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:9999;}
#toast.show{opacity:1;}

.setup-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;
  align-items:center;justify-content:center;z-index:10000;padding:20px;}
.setup-modal.show{display:flex;}
.setup-card{background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:22px;max-width:440px;width:100%;}
.setup-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.setup-row label{width:100px;font-size:.82rem;color:var(--muted);}
.setup-row select{flex:1;background:var(--elev);border:1px solid var(--border);
  color:var(--text);padding:8px;border-radius:6px;font-family:inherit;font-size:.85rem;}
.setup-buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.setup-buttons button{padding:9px 20px;border-radius:7px;font-size:.85rem;
  font-family:inherit;cursor:pointer;border:1px solid var(--border);
  background:var(--elev);color:var(--text);font-weight:600;}
.setup-buttons button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}

@media(max-width:800px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;
    border-bottom:1px solid var(--border);max-height:300px;}
  .main-content{padding:16px 14px 220px;}
  .demo-bar{left:0;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">⛏️</div>
  <div class="title">
    <h1>Minecraft 遊戲說明</h1>
    <div class="en">Minecraft Game Guide</div>
  </div>
  <div class="voice-mode" id="voiceMode">
    <button data-mode="zh" class="active">🀄 中文</button>
    <button data-mode="en">🔤 EN</button>
    <button data-mode="both">🌐 雙語</button>
  </div>
  <button id="startBtn">▶ 開始教學</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content" id="mainContent"></main>
</div>

<div class="demo-bar" id="demoBar">
  <div class="demo-head">
    <button id="prevStep">← 上一句</button>
    <button class="primary" id="playBtn">⏸ 暫停</button>
    <button id="nextStep">下一句 →</button>
    <span class="spacer"></span>
    <button id="exitBtn">✕ 結束</button>
  </div>
  <div class="demo-caption" id="caption"></div>
</div>

<div class="setup-modal" id="setupModal">
  <div class="setup-card">
    <h3>演示設定</h3>
    <div class="setup-row"><label>🎙 聲音</label><select id="voiceSelect"></select></div>
    <div class="setup-row"><label>⚡ 語速</label>
      <select id="speedSelect">
        <option value="0.8">0.8× 慢</option>
        <option value="1.0" selected>1.0× 正常</option>
        <option value="1.2">1.2× 快</option>
      </select>
    </div>
    <div class="setup-buttons">
      <button id="cancelBtn">取消</button>
      <button class="primary" id="confirmBtn">▶ 開始</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   選單
   ============================================================ */
const MENU = [

/* ============================================================
   語音
   ============================================================ */
const VOICE = {
  zh: null, en: null, all: [], rate: 1.0, mode: 'zh',
  load(){
    this.all = speechSynthesis.getVoices();
    const tw = this.all.filter(v => /zh[-_]TW/i.test(v.lang) || v.name.includes('台灣'));
    this.zh = tw.find(v => v.name.includes('HsiaoChen')) ||
              tw.find(v => v.name.includes('曉臻')) ||
              tw.find(v => v.name.includes('HsiaoYu')) ||
              tw.find(v => v.name.includes('曉雨')) ||
              tw.find(v => v.name.includes('YunJhe')) ||
              tw.find(v => v.name.includes('雲哲')) ||
              tw.find(v => v.name.includes('Online')) ||
              tw.find(v => v.name.includes('Google')) ||
              tw[0] || this.all.find(v => v.lang.startsWith('zh'));
    this.en = this.all.find(v => /en[-_]US/i.test(v.lang) && v.name.includes('Online')) ||
              this.all.find(v => /en[-_]US/i.test(v.lang)) ||
              this.all.find(v => v.lang.startsWith('en'));
    return this.all.length > 0;
  },
  _speakOne(text, lang){
    return new Promise(resolve => {
      const u = new SpeechSynthesisUtterance(text);
      const v = lang === 'zh' ? this.zh : this.en;
      if (v){ u.voice = v; u.lang = v.lang; }
      else u.lang = lang === 'zh' ? 'zh-TW' : 'en-US';
      u.rate = this.rate; u.pitch = 1.05;
      u.onend = resolve; u.onerror = resolve;
      speechSynthesis.speak(u);
    });
  },
  async speak(zhText, enText, onEnd){
    speechSynthesis.cancel();
    if (this.mode === 'zh') await this._speakOne(zhText, 'zh');
    else if (this.mode === 'en') await this._speakOne(enText, 'en');
    else { await this._speakOne(zhText, 'zh'); await new Promise(r => setTimeout(r, 150)); await this._speakOne(enText, 'en'); }
    onEnd && onEnd();
  },
  stop(){ speechSynthesis.cancel(); }
};

function loadVoicesWithRetry(attempt = 0){
  const ok = VOICE.load();
  if (ok) return;
  if (attempt < 10) setTimeout(() => loadVoicesWithRetry(attempt + 1), 300);
}
speechSynthesis.addEventListener('voiceschanged', () => loadVoicesWithRetry());

function bi(zh, en){
  if (VOICE.mode === 'zh') return zh;
  if (VOICE.mode === 'en') return en;
  return `${zh}<span style="display:block;font-size:.78rem;color:var(--muted);margin-top:2px;">${en}</span>`;
}
function biInline(zh, en){
  if (VOICE.mode === 'zh') return zh;
  if (VOICE.mode === 'en') return en;
  return `${zh} <span style="color:var(--muted);font-size:.85em;">${en}</span>`;
}

        const subBtn = document.createElement('button');
        subBtn.className = 'sidebar-item sidebar-sub' + (sub.id === currentId ? ' active' : '');
        subBtn.innerHTML = `<span class="num">${sub.num}</span><span>${biInline(sub.zh, sub.en)}</span>`;
        subBtn.addEventListener('click', () => switchTo(sub.id));
        sb.appendChild(subBtn);
      });
      return;
    }
    if (m.parent) return;
    const btn = document.createElement('button');
    btn.className = 'sidebar-item' + (m.id === currentId ? ' active' : '');
    btn.innerHTML = `<span class="ico">${m.ico || ''}</span>${m.num ? `<span class="num">${m.num}</span>` : ''}<span>${biInline(m.zh, m.en)}</span>`;
    btn.addEventListener('click', () => switchTo(m.id));
    sb.appendChild(btn);
  });
}

function switchTo(id){
  currentId = id;
  demoIndex = 0;
  lastScrolledSec = -1;
  if (demoOn) exitDemo();
  renderSidebar();
  renderContent();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderContent(){
  const mc = $('mainContent');
  const data = CONTENT[currentId];
  if (!data){ mc.innerHTML = '<p>內容載入中...</p>'; return; }

  let html = `<div class="unit-header">
    <div class="badge">📖 ${biInline('單元', 'Unit')}</div>
    <h2>${bi(data.titleZh, data.titleEn)}</h2>
  </div>`;

  data.sections.forEach((sec, idx) => {
    if (sec.why){
      html += `<div class="section" id="sec-${idx}"><div style="background:var(--elev);border-left:4px solid var(--warm);padding:12px 16px;border-radius:8px;font-size:.92rem;line-height:1.8;">${bi(sec.body, sec.bodyEn)}</div></div>`;
      return;
    }
    html += `<div class="section" id="sec-${idx}"><h3>${bi(sec.titleZh, sec.titleEn)}</h3><p style="line-height:1.9;">${bi(sec.body, sec.bodyEn)}</p>`;

    if (sec.mouseVisual){
      html += `<div style="text-align:center;">
        <div class="mouse-vis">
          <div class="mouse-body">
            <div class="mouse-btn-l"></div>
            <div class="mouse-btn-r"></div>
            <div class="mouse-wheel"></div>
          </div>
          <div class="mouse-label">
            <span class="l">左鍵 挖</span>
            <span class="w">滾輪 換</span>
            <span class="r">右鍵 放</span>
          </div>
        </div>
      </div>`;
    }

    if (sec.steps){
      html += '<div class="step-list">';
      sec.steps.forEach(s => {
        html += `<div class="step-item"><span class="sn">${s.n}</span><span class="st">${bi(s.zh, s.en)}</span></div>`;
      });
      html += '</div>';
    }

    if (sec.table){
      html += '<table class="data-table"><thead><tr>' + sec.table.head.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
      sec.table.rows.forEach(r => { html += '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>'; });
      html += '</tbody></table>';
    }

    if (sec.keyboard){
      html += `<div style="text-align:center;margin:14px 0;">
        <div class="kb-vis" style="display:inline-grid;">
          <div class="kb-row">
            <div class="kb-key" style="visibility:hidden;">　</div>
            <div class="kb-key hl">W</div>
            <div class="kb-key" style="visibility:hidden;">　</div>
          </div>
          <div class="kb-row">
            <div class="kb-key">A</div>
            <div class="kb-key">S</div>
            <div class="kb-key">D</div>
          </div>
        </div>
      </div>`;
    }

    if (sec.grid){
      html += `<div class="grid-cards">`;
      sec.grid.forEach(g => {
        html += `<div class="mini-card">
          <div class="ico">${g.ico}</div>
          <div class="t">${g.t}</div>
          <div class="s">${g.s}</div>
        </div>`;
      });
      html += `</div>`;
    }

    if (sec.checklist){
      html += '<div class="checklist"><h4>✅ 我可以做到這些嗎？</h4>';
      sec.checklist.forEach(c => {
        html += `<label><input type="checkbox"><span>${c}</span></label>`;
      });
      html += '</div>';
    }

    if (sec.faq){
      html += '<div class="faq">';
      sec.faq.forEach(f => {
        html += `<div class="faq-item"><div class="q">${f.q}</div><div class="a">${f.a}</div></div>`;
      });
      html += '</div>';
    }

    if (sec.refs){
      html += '<div class="ref-grid">';
      sec.refs.forEach(r => {
        html += `<a class="ref-card" href="${r.url}" target="_blank" rel="noopener">
          <div class="cat">${r.cat}</div>
          <h4>${biInline(r.title, r.titleEn || r.title)}</h4>
          <div class="url">${r.url}</div>
          <div class="desc">${biInline(r.desc, r.descEn || r.desc)}</div>
        </a>`;
      });
      html += '</div>';
    }

    if (sec.images){
      sec.images.forEach(img => {
        const path = `images/${img.name}`;
        html += `<div class="img-block" id="img-${img.num}">
          <img src="${path}" alt="${img.content}" onerror="this.style.display='none';">
          <div class="img-slot">
            <span class="img-num">📷 ${VOICE.mode === 'en' ? 'Fig' : '圖'} ${img.num}</span>
            <div class="img-name">${path}</div>
            <div class="img-desc">
              <b>${VOICE.mode === 'en' ? 'Content:' : '內容：'}</b>${bi(img.content, img.contentEn || img.content)}<br>
              <b>${VOICE.mode === 'en' ? 'How:' : '怎麼做：'}</b>${bi(img.desc, img.descEn || img.desc)}
              <div class="script">${bi(img.script, img.scriptEn || img.script)}</div>
            </div>
          </div>
        </div>`;
      });
    }

    if (sec.tips){
      sec.tips.forEach(t => {
        html += `<div class="tip">💡 ${bi(t.zh, t.en)}</div>`;
      });
    }

    html += '</div>';
  });

  mc.innerHTML = html;
}

/* ★ 捲動到 section（等圖片載入完才滾） ★ */
function scrollToSection(idx){
  if (idx === undefined || idx === null) return;
  const target = document.getElementById('sec-' + idx);
  if (!target) return;

  document.querySelectorAll('.section').forEach(s => s.classList.remove('focused'));
  target.classList.add('focused');

  const imgs = target.querySelectorAll('img');
  const pending = [...imgs].filter(img => !img.complete);
  if (pending.length > 0){
    Promise.all(pending.map(img => new Promise(res => {
      img.addEventListener('load', res, { once: true });
      img.addEventListener('error', res, { once: true });
    }))).then(() => doScrollEl(target));
  } else {
    doScrollEl(target);
  }
}

function doScrollEl(target){
  const topbar = document.querySelector('.topbar');
  const demoBar = document.getElementById('demoBar');
  const topbarH = topbar ? topbar.getBoundingClientRect().height : 52;
  const demoBarH = (demoBar && demoBar.classList.contains('open'))
                    ? demoBar.getBoundingClientRect().height : 0;

  const viewportH = window.innerHeight;
  const padding = 20;
  const availTop = topbarH + padding;
  const availBottom = viewportH - demoBarH - padding;
  const availH = availBottom - availTop;

  const rect = target.getBoundingClientRect();
  const targetH = rect.height;
  const targetTopAbs = rect.top + window.scrollY;

  let scrollTo;
  if (targetH <= availH) {
    const offset = availTop + (availH - targetH) / 2;
    scrollTo = targetTopAbs - offset;
  } else {
    scrollTo = targetTopAbs - availTop;
  }

  window.scrollTo({ top: scrollTo, behavior: 'smooth' });
}

function clearTimers(){ demoTimers.forEach(clearTimeout); demoTimers = []; }
function schedule(fn, d){ const t = setTimeout(fn, d); demoTimers.push(t); return t; }

function playStep(i){
  const data = CONTENT[currentId];
  if (!data || !data.steps || i >= data.steps.length){ finishAll(); return; }
  demoIndex = i;
  clearTimers(); demoToken++;
  const token = demoToken;
  const step = data.steps[i];
  $('caption').innerHTML = bi(step.zh, step.en);

  /* ★ 只有換 section 才滾動 ★ */
  if (step.sec !== undefined && step.sec !== lastScrolledSec){
    scrollToSection(step.sec);
    lastScrolledSec = step.sec;
  }

  VOICE.speak(step.zh, step.en, () => {
    if (token !== demoToken || !demoPlaying || demoPaused) return;
    schedule(() => {
      if (token !== demoToken || !demoPlaying || demoPaused) return;
      playStep(i + 1);
    }, 400);
  });
}

function startDemo(){
  demoOn = true; demoPlaying = true; demoPaused = false; demoIndex = 0;
  lastScrolledSec = -1;
  $('startBtn').classList.add('on');
  $('startBtn').textContent = '✕ 結束';
  $('demoBar').classList.add('open');
  $('playBtn').textContent = '⏸ 暫停';
  playStep(0);
}

function pauseDemo(){
  demoPaused = true;
  $('playBtn').textContent = '▶ 繼續';
  speechSynthesis.cancel();
  clearTimers();
  demoToken++;
}

function resumeDemo(){
  demoPaused = false;
  $('playBtn').textContent = '⏸ 暫停';
  demoToken++;
  const token = demoToken;
  const data = CONTENT[currentId];
  if (!data || !data.steps) return;
  const step = data.steps[demoIndex];
  if (!step) return;
  $('caption').innerHTML = bi(step.zh, step.en);
  if (step.sec !== undefined) scrollToSection(step.sec);
  VOICE.speak(step.zh, step.en, () => {
    if (token !== demoToken || !demoPlaying || demoPaused) return;
    schedule(() => {
      if (token !== demoToken || !demoPlaying || demoPaused) return;
      playStep(demoIndex + 1);
    }, 400);
  });
}

function finishAll(){
  demoPlaying = false; demoPaused = false;
  $('playBtn').textContent = '↻ 重播';
  toast('🎉 完成！');
  setTimeout(() => { if (!demoPlaying) exitDemo(); }, 3000);
}

function exitDemo(){
  demoOn = false; demoPlaying = false; demoPaused = false;
  demoToken++;
  VOICE.stop(); clearTimers();
  lastScrolledSec = -1;
  $('startBtn').classList.remove('on');
  $('startBtn').textContent = '▶ 開始教學';
  $('demoBar').classList.remove('open');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('focused'));
}

$('startBtn').addEventListener('click', () => { if (demoOn){ exitDemo(); return; } openSetup(); });
$('playBtn').addEventListener('click', () => {
  if (!demoOn){ openSetup(); return; }
  if (!demoPlaying && !demoPaused){ demoIndex = 0; startDemo(); return; }
  if (demoPaused) resumeDemo(); else pauseDemo();
});
$('nextStep').addEventListener('click', () => {
  if (!demoOn) return;
  VOICE.stop(); clearTimers();
  demoPlaying = true; demoPaused = false;
  playStep(demoIndex + 1);
});
$('prevStep').addEventListener('click', () => {
  if (!demoOn || demoIndex === 0) return;
  VOICE.stop(); clearTimers();
  demoPlaying = true; demoPaused = false;
  playStep(demoIndex - 1);
});
$('exitBtn').addEventListener('click', exitDemo);

document.querySelectorAll('#voiceMode button').forEach(btn => {
  btn.addEventListener('click', () => {
    VOICE.mode = btn.dataset.mode;
    document.querySelectorAll('#voiceMode button').forEach(b => b.classList.toggle('active', b === btn));
    renderSidebar(); renderContent();
    if (demoOn && demoPlaying){
      VOICE.stop(); clearTimers();
      demoToken++;
      const token = demoToken;
      const data = CONTENT[currentId];
      const step = data && data.steps && data.steps[demoIndex];
      if (step){
        demoPaused = false;
        $('caption').innerHTML = bi(step.zh, step.en);
        if (step.sec !== undefined) scrollToSection(step.sec);
        VOICE.speak(step.zh, step.en, () => {
          if (token !== demoToken || !demoPlaying || demoPaused) return;
          schedule(() => {
            if (token !== demoToken || !demoPlaying || demoPaused) return;
            playStep(demoIndex + 1);
          }, 400);
        });
      }
    } else {
      VOICE.stop();
    }
  });
});

function openSetup(){
  const sel = $('voiceSelect'); sel.innerHTML = '';
  if (VOICE.zh){ const o = document.createElement('option'); o.value = 'zh'; o.textContent = '🀄 ' + VOICE.zh.name; sel.appendChild(o); }
  if (VOICE.en){ const o = document.createElement('option'); o.value = 'en'; o.textContent = '🔤 ' + VOICE.en.name; sel.appendChild(o); }
  sel.value = VOICE.mode;
  $('setupModal').classList.add('show');
}
$('cancelBtn').addEventListener('click', () => $('setupModal').classList.remove('show'));
$('confirmBtn').addEventListener('click', () => {
  VOICE.mode = $('voiceSelect').value;
  document.querySelectorAll('#voiceMode button').forEach(b => b.classList.toggle('active', b.dataset.mode === VOICE.mode));
  $('setupModal').classList.remove('show');
  renderSidebar(); renderContent();
  startDemo();
});

let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.className = 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2600);
}

(function init(){
  VOICE.rate = 1.0;
  renderSidebar();
  renderContent();
  loadVoicesWithRetry();
})();
</script>
