<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft 遊戲說明 ｜ Minecraft Game Guide</title>
<style>
:root{
  --bg:#0e1420; --panel:#151d2c; --elev:#1e283c; --border:#2a3852;
  --text:#e6edf6; --muted:#93a2b8; --dim:#8496b0;
  --green:#3d7a31; --green-d:#2c5a23;
  --accent:#2d6cbd; --accent-soft:#6aa9ee;
  --warm:#f0c840;
  --topbar-h:52px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.65;}
img{max-width:100%;display:block;}

.topbar{background:linear-gradient(135deg,#0e1420,#1a2844);
  border-bottom:1px solid var(--border);padding:8px 16px;
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar .logo{width:34px;height:34px;background:var(--green);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.topbar .title{flex:1;min-width:0;}
.topbar .title h1{margin:0;font-size:.95rem;font-weight:700;}
.topbar .title .en{font-size:.72rem;color:var(--muted);font-weight:500;}
.voice-mode{display:flex;background:var(--elev);border:1px solid var(--border);
  border-radius:7px;padding:2px;gap:1px;flex-shrink:0;}
.voice-mode button{background:transparent;border:none;color:var(--muted);
  padding:6px 11px;border-radius:5px;cursor:pointer;font-family:inherit;
  font-size:.72rem;font-weight:600;min-height:32px;}
.voice-mode button.active{background:var(--accent);color:#fff;}
#startBtn{background:var(--green);border:none;color:#fff;
  padding:8px 14px;border-radius:7px;font-weight:700;font-size:.78rem;
  cursor:pointer;font-family:inherit;flex-shrink:0;min-height:34px;}
#startBtn.on{background:#a04a4a;}
#startBtn:focus-visible,.voice-mode button:focus-visible,
.sidebar-item:focus-visible,.demo-head button:focus-visible,
.setup-buttons button:focus-visible{outline:2px solid var(--warm);outline-offset:2px;}

.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - var(--topbar-h));}
.sidebar{background:var(--panel);border-right:1px solid var(--border);
  padding:16px 12px;overflow-y:auto;position:sticky;top:var(--topbar-h);
  height:calc(100vh - var(--topbar-h));}
.sidebar-group-title{font-size:.7rem;color:var(--dim);letter-spacing:1.5px;
  text-transform:uppercase;font-weight:700;padding:10px 10px 6px;}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-radius:8px;cursor:pointer;font-family:inherit;
  font-size:.83rem;font-weight:600;color:var(--muted);
  background:transparent;border:none;width:100%;text-align:left;
  margin-bottom:2px;transition:.15s;min-height:38px;}
.sidebar-item:hover{background:var(--elev);color:var(--text);}
.sidebar-item.active{background:var(--accent);color:#fff;}
.sidebar-item .ico{font-size:1rem;flex-shrink:0;width:20px;text-align:center;}
.sidebar-item .num{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--border);
  color:var(--text);font-size:.7rem;font-weight:800;flex-shrink:0;}
.sidebar-item.active .num{background:rgba(255,255,255,.3);color:#fff;}
.sidebar-sub{padding-left:30px;font-size:.8rem;padding:9px 12px 9px 30px;}
.sidebar-sub .num{width:20px;height:20px;font-size:.65rem;}

.main-content{padding:24px 28px 200px;max-width:1100px;}
.unit-header{margin-bottom:18px;}
.unit-header .badge{display:inline-block;background:var(--accent);color:#fff;
  padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;margin-bottom:8px;}
.unit-header h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;color:var(--warm);}

.section{background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:20px;margin-bottom:14px;
  transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;}
.section.focused{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent), 0 0 32px rgba(74,144,226,.35);
  transform:scale(1.008);
}
.section.focused h3::before{
  background:var(--warm);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(240,200,64,.6); }
  50%{ box-shadow:0 0 0 8px rgba(240,200,64,0); }
}

.section h3{margin:0 0 12px;font-size:1rem;color:var(--accent-soft);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.section h3::before{content:"";width:4px;height:18px;background:var(--accent-soft);
  border-radius:2px;transition:.3s;}
.section p{margin:8px 0;font-size:.92rem;}
.section .tip{background:var(--elev);border-left:3px solid var(--green);
  padding:10px 14px;border-radius:6px;margin:12px 0;font-size:.86rem;}
.section .goal{background:rgba(240,200,64,.12);border-left:3px solid var(--warm);
  padding:10px 14px;border-radius:6px;margin:10px 0;font-size:.9rem;color:#ffe9a0;}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;}
.data-table{width:100%;border-collapse:collapse;background:var(--elev);
  border-radius:8px;overflow:hidden;font-size:.85rem;min-width:420px;}
.data-table th{background:var(--border);color:var(--text);padding:8px 10px;
  text-align:left;font-size:.78rem;font-weight:700;}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--border);}
.data-table .key{background:var(--bg);color:var(--warm);font-family:monospace;
  font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;font-size:.8rem;}

/* ============================================================
   ★ 左右分欄：左欄（正文 + 步驟）、右欄（圖片）
   圖片頂部與正文第一行對齊
   ============================================================ */
.content-row{
  display:flex;
  gap:20px;
  align-items:flex-start;
  margin:14px 0 0 0;
}
.content-row .left-column{
  flex:1 1 50%;
  min-width:0;
}
.content-row .left-column > p:first-child{
  margin-top:0;
}
.content-row .left-column .step-list{
  margin-top:14px;
}
.content-row .img-column{
  flex:1 1 50%;
  min-width:0;
}

.img-block{display:flex;flex-direction:column;gap:8px;
  margin:0;background:transparent;border:none;padding:0;}
.img-block + .img-block{margin-top:20px;}
.img-block img{width:100%;height:auto;max-height:420px;
  object-fit:contain;border-radius:8px;background:#0b1018;display:block;
  vertical-align:top;margin-top:0;
  transition:box-shadow .3s;}
.img-block .img-slot{position:relative;}
.img-block .img-slot .img-num{display:inline-block;margin-bottom:6px;
  background:var(--warm);color:#1a1a1a;padding:2px 10px;
  border-radius:12px;font-size:.72rem;font-weight:800;}
.img-block .img-slot .img-name{font-family:monospace;font-size:.78rem;
  color:var(--accent-soft);margin:6px 0 8px;padding:4px 10px;
  background:rgba(74,144,226,.12);border-radius:5px;display:inline-block;
  word-break:break-all;}
.img-block .img-slot .img-desc{font-size:.86rem;line-height:1.6;}
.img-block .img-slot .img-desc b{color:var(--warm);}
.img-block .img-slot .img-desc .script{margin-top:8px;padding:8px 12px;
  background:rgba(240,200,64,.1);border-left:2px solid var(--warm);
  border-radius:4px;font-size:.82rem;color:#ffe9a0;font-style:italic;}
.img-block .img-slot .img-desc .script::before{content:"🎙️ 「";color:var(--warm);font-style:normal;}
.img-block .img-slot .img-desc .script::after{content:"」";color:var(--warm);font-style:normal;}
.img-block.img-failed img{display:none;}
.img-block.current img{box-shadow:0 0 0 3px var(--accent), 0 0 24px rgba(74,144,226,.5);}

.video-block{background:linear-gradient(135deg,#1a1f2e,#131a28);
  border:2px solid var(--accent);border-radius:12px;
  padding:16px;margin:24px 0 8px;}
.video-block .video-head{display:flex;align-items:center;gap:8px;
  font-size:.95rem;font-weight:800;color:var(--warm);margin-bottom:6px;}
.video-block .video-head .yt-ico{color:#ff4444;font-size:1.15rem;}
.video-block .video-note{font-size:.82rem;color:var(--muted);
  margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--border);}
.video-frame{position:relative;width:100%;padding-top:56.25%;
  border-radius:10px;overflow:hidden;background:#000;
  box-shadow:0 6px 20px rgba(0,0,0,.4);}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.video-links{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
.video-links a{display:inline-flex;align-items:center;gap:6px;
  background:var(--elev);border:1px solid var(--border);color:var(--text);
  text-decoration:none;padding:8px 14px;border-radius:7px;
  font-size:.82rem;font-weight:600;transition:.15s;min-height:36px;}
.video-links a:hover{border-color:var(--accent);background:var(--accent);color:#fff;}

.kb-vis{display:inline-grid;gap:3px;margin:12px 0;}
.kb-row{display:flex;gap:3px;justify-content:center;}
.kb-key{background:var(--elev);border:1px solid var(--border);
  border-radius:4px;padding:6px 10px;font-size:.75rem;font-weight:700;
  color:var(--text);min-width:32px;text-align:center;}
.kb-key.hl{background:var(--accent);color:#fff;border-color:var(--accent);}

.mouse-vis{display:inline-block;margin:14px 0;text-align:center;}
.mouse-body{width:80px;height:130px;background:var(--elev);
  border:2px solid var(--border);border-radius:40px 40px 30px 30px;
  position:relative;margin:0 auto;}
.mouse-btn-l,.mouse-btn-r{position:absolute;top:0;width:38px;height:50px;
  border-bottom:1px solid var(--border);}
.mouse-btn-l{left:0;border-right:1px solid var(--border);
  border-radius:40px 0 0 0;background:rgba(74,144,226,.3);}
.mouse-btn-r{right:0;border-radius:0 40px 0 0;background:rgba(74,143,60,.3);}
.mouse-wheel{position:absolute;top:20px;left:50%;transform:translateX(-50%);
  width:8px;height:24px;background:var(--warm);border-radius:4px;}
.mouse-label{margin-top:10px;font-size:.8rem;color:var(--muted);}
.mouse-label span{display:inline-block;margin:0 4px;padding:2px 8px;
  border-radius:4px;font-size:.72rem;font-weight:700;}
.mouse-label .l{background:rgba(74,144,226,.3);color:#9cc4f0;}
.mouse-label .r{background:rgba(74,143,60,.3);color:#a0d090;}
.mouse-label .w{background:rgba(240,200,64,.3);color:#f0d070;}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;margin:12px 0;}
.mini-card{background:var(--elev);border:1px solid var(--border);
  border-radius:8px;padding:12px;text-align:center;}
.mini-card .ico{font-size:1.8rem;}
.mini-card .t{font-weight:700;font-size:.8rem;margin-top:4px;}
.mini-card .s{font-size:.7rem;color:var(--muted);margin-top:2px;}

.step-list{display:flex;flex-direction:column;gap:8px;margin:0;}
.step-item{display:flex;align-items:flex-start;gap:10px;
  background:var(--elev);border-radius:8px;padding:10px 14px;}
.step-item .sn{display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--accent);
  color:#fff;font-size:.72rem;font-weight:800;flex-shrink:0;margin-top:2px;}
.step-item .st{flex:1;font-size:.88rem;}

.checklist{background:linear-gradient(135deg,rgba(74,143,60,.15),rgba(74,143,60,.05));
  border:1px solid var(--green);border-radius:10px;padding:14px 18px;margin:14px 0;}
.checklist h4{margin:0 0 10px;font-size:.9rem;color:#a0d090;}
.checklist label{display:flex;align-items:flex-start;gap:8px;padding:6px 0;
  font-size:.88rem;cursor:pointer;}
.checklist input[type=checkbox]{margin-top:5px;accent-color:var(--green);
  width:16px;height:16px;}

.faq{margin:14px 0;}
.faq-item{background:var(--elev);border-radius:8px;padding:12px 16px;margin-bottom:8px;}
.faq-item .q{font-weight:700;color:var(--warm);margin-bottom:6px;font-size:.88rem;}
.faq-item .a{font-size:.86rem;color:var(--text);}

.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.ref-card{background:var(--elev);border:1px solid var(--border);border-radius:10px;
  padding:16px;transition:.15s;text-decoration:none;color:var(--text);display:block;}
.ref-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.ref-card .cat{font-size:.72rem;color:var(--accent-soft);font-weight:700;margin-bottom:6px;}
.ref-card h4{margin:0 0 6px;font-size:.92rem;}
.ref-card .url{font-size:.75rem;color:var(--muted);font-family:monospace;
  word-break:break-all;margin-bottom:6px;}
.ref-card .desc{font-size:.8rem;color:var(--muted);}

.demo-bar{position:fixed;bottom:0;left:260px;right:0;background:rgba(14,20,32,.98);
  border-top:2px solid var(--accent);padding:8px 14px 10px;
  display:none;flex-direction:column;gap:6px;z-index:200;
  box-shadow:0 -6px 24px rgba(0,0,0,.6);}
.demo-bar.open{display:flex;}
.demo-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.demo-head button{background:var(--elev);border:1px solid var(--border);
  color:var(--text);padding:8px 14px;border-radius:6px;cursor:pointer;
  font-family:inherit;font-size:.8rem;font-weight:600;min-height:40px;}
.demo-head button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.demo-head .spacer{flex:1;}
.demo-caption{font-size:.92rem;line-height:1.55;background:var(--elev);
  padding:10px 14px;border-radius:7px;border-left:3px solid var(--accent);}

#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#fff;padding:10px 20px;border-radius:7px;
  font-weight:600;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:9999;}
#toast.show{opacity:1;}

.setup-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;
  align-items:center;justify-content:center;z-index:10000;padding:20px;}
.setup-modal.show{display:flex;}
.setup-card{background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:22px;max-width:460px;width:100%;}
.setup-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.setup-row label{width:100px;font-size:.82rem;color:var(--muted);}
.setup-row select{flex:1;background:var(--elev);border:1px solid var(--border);
  color:var(--text);padding:8px;border-radius:6px;font-family:inherit;font-size:.85rem;}
.setup-buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.setup-buttons button{padding:10px 20px;border-radius:7px;font-size:.85rem;
  font-family:inherit;cursor:pointer;border:1px solid var(--border);
  background:var(--elev);color:var(--text);font-weight:600;min-height:40px;}
.setup-buttons button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
  .section.focused{transform:none;}
}

@media(max-width:800px){
  .layout{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;
    border-bottom:1px solid var(--border);max-height:300px;}
  .main-content{padding:16px 14px 240px;}
  .demo-bar{left:0;}
  .content-row{flex-direction:column;gap:16px;}
  .content-row .left-column,
  .content-row .img-column{flex:1 1 100%;width:100%;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">⛏️</div>
  <div class="title">
    <h1>Minecraft 遊戲說明</h1>
    <div class="en">Minecraft Game Guide</div>
  </div>
  <div class="voice-mode" id="voiceMode" role="group" aria-label="語言模式">
    <button data-mode="zh" class="active">🀄 中文</button>
    <button data-mode="en">🔤 EN</button>
    <button data-mode="both">🌐 雙語</button>
  </div>
  <button id="startBtn">▶ 開始教學</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="單元選單"></aside>
  <main class="main-content" id="mainContent"></main>
</div>

<div class="demo-bar" id="demoBar">
  <div class="demo-head">
    <button id="prevStep">← 上一句</button>
    <button class="primary" id="playBtn">⏸ 暫停</button>
    <button id="nextStep">下一句 →</button>
    <span class="spacer"></span>
    <button id="exitBtn">✕ 結束</button>
  </div>
  <div class="demo-caption" id="caption" role="status" aria-live="polite"></div>
</div>

<div class="setup-modal" id="setupModal" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
  <div class="setup-card">
    <h3 id="setupTitle">演示設定</h3>
    <div class="setup-row"><label>🌐 語言</label>
      <select id="modeSelect">
        <option value="zh">🀄 中文</option>
        <option value="en">🔤 EN</option>
        <option value="both">🌐 雙語</option>
      </select>
    </div>
    <div class="setup-row"><label>🎙 聲音</label>
      <select id="voiceSelect"></select>
    </div>
    <div class="setup-row"><label>⚡ 語速</label>
      <select id="speedSelect">
        <option value="0.8">0.8× 慢</option>
        <option value="1.0" selected>1.0× 正常</option>
        <option value="1.2">1.2× 快</option>
      </select>
    </div>
    <div class="setup-buttons">
      <button id="cancelBtn">取消</button>
      <button class="primary" id="confirmBtn">▶ 開始</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const MENU = [
  { id: 'download', ico: '📥', zh: '教育版下載與登錄', en: 'Download & Login' },
  { id: 'task', ico: '📦', zh: '任務', en: 'Tasks', group: true },
  { id: 'task01', num: '01', zh: '任務01：移動', en: 'Movement', parent: 'task' },
  { id: 'task02', num: '02', zh: '任務02：放置與打破', en: 'Place & Break', parent: 'task' },
  { id: 'task03', num: '03', zh: '任務03：互動與彩蛋', en: 'Interaction', parent: 'task' },
  { id: 'task04', num: '04', zh: '任務04：相機與個人資料', en: 'Camera', parent: 'task' },
  { id: 'task05', num: '05', zh: '任務05：黑板', en: 'Chalkboard', parent: 'task' },
  { id: 'task06', num: '06', zh: '任務06：NPC', en: 'NPC', parent: 'task' },
  { id: 'refs', ico: '🔗', zh: '參考網頁', en: 'References' }
];

/* ============================================================
   CONTENT：正文詳細（講解為什麼/目標），步驟只寫動作
   ============================================================ */
const CONTENT = {

download: {
  titleZh: '教育版下載與登錄', titleEn: 'Download & Login',
  video: null,
  sections: [
    { why: true,
      body: '歡迎來到麥塊社團！<br>第一次玩麥塊，要先做三件事：<br><b>① 下載</b>：把遊戲裝到電腦裡<br><b>② 安裝</b>：讓遊戲可以打開<br><b>③ 登入</b>：用學校給你的帳號進去<br>跟著老師一步一步做，每個人都能成功！',
      bodyEn: 'Welcome! Do three things: download, install, and log in.' },

    { titleZh: '🌐 第一步：找到網站', titleEn: '1. Find the Website',
      body: 'Minecraft 教育版的官方網站是 <b>education.minecraft.net</b>。<br>這個網址可以抄在聯絡簿上，回家也能自己練習。<br>網站右上角有一個紅色的 <b>Download Minecraft</b> 按鈕，這是下載遊戲的入口。<br>找到它之後，就可以進入下一步。',
      bodyEn: 'Official site is education.minecraft.net. The red Download Minecraft button is at the top-right.',
      steps: [
        { n: '1', zh: '打開瀏覽器（Chrome / Edge / Safari）', en: 'Open a browser' },
        { n: '2', zh: '網址列輸入 education.minecraft.net', en: 'Type the address' },
        { n: '3', zh: '按 Enter 進入網站', en: 'Press Enter' },
        { n: '4', zh: '看右上角，找到 Download Minecraft 按鈕', en: 'Find the Download button top-right' }
      ],
      images: [
        { num: '0-1', name: 'download-site.png', content: '官方網站首頁', contentEn: 'Official website',

/* ============================================================
   語音引擎
   ============================================================ */
const HAS_TTS = typeof window !== 'undefined' && 'speechSynthesis' in window;
let _fallbackTimer = null, _fallbackResolve = null;

const VOICE = {
  zh: null, en: null, all: [], rate: 1.0, mode: 'zh',
  load(){
    if (!HAS_TTS) return false;
    this.all = speechSynthesis.getVoices();
    const tw = this.all.filter(v => /zh[-_]TW/i.test(v.lang) || v.name.includes('台灣'));
    this.zh = tw.find(v => v.name.includes('HsiaoChen')) ||
              tw.find(v => v.name.includes('曉臻')) ||
              tw.find(v => v.name.includes('HsiaoYu')) ||
              tw.find(v => v.name.includes('曉雨')) ||
              tw.find(v => v.name.includes('YunJhe')) ||
              tw.find(v => v.name.includes('雲哲')) ||
              tw.find(v => v.name.includes('Online')) ||
              tw.find(v => v.name.includes('Google')) ||
              tw[0] || this.all.find(v => v.lang.startsWith('zh'));
    this.en = this.all.find(v => /en[-_]US/i.test(v.lang) && v.name.includes('Online')) ||
              this.all.find(v => /en[-_]US/i.test(v.lang)) ||
              this.all.find(v => v.lang.startsWith('en'));
    return this.all.length > 0;
  },
  _speakOne(text, lang, overrideVoice){
    return new Promise(resolve => {
      if (!HAS_TTS) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      const v = overrideVoice || (lang === 'zh' ? this.zh : this.en);
      if (v){ u.voice = v; u.lang = v.lang; }
      else u.lang = lang === 'zh' ? 'zh-TW' : 'en-US';
      u.rate = this.rate; u.pitch = 1.05;
      let done = false;
      const finish = () => { if (!done){ done = true; resolve(); } };
      u.onend = finish; u.onerror = finish;
      const guard = setTimeout(finish, Math.max(6000, text.length * 350));
      u.addEventListener('end', () => clearTimeout(guard), { once: true });
      speechSynthesis.speak(u);
    });
  },
  async speak(zhText, enText, onEnd){
    if (!HAS_TTS){
      const t = this.mode === 'en' ? enText : zhText;
      const ms = Math.max(1500, (t || '').length * 200);
      await new Promise(r => { _fallbackResolve = r; _fallbackTimer = setTimeout(r, ms); });
      _fallbackResolve = null;
      onEnd && onEnd();
      return;
    }
    speechSynthesis.cancel();
    await new Promise(r => setTimeout(r, 60));
    if (this.mode === 'zh') await this._speakOne(zhText, 'zh');
    else if (this.mode === 'en') await this._speakOne(enText, 'en');
    else {
      await this._speakOne(zhText, 'zh');
      await new Promise(r => setTimeout(r, 150));
      await this._speakOne(enText, 'en');
    }
    onEnd && onEnd();
  },
  stop(){
    if (_fallbackTimer){ clearTimeout(_fallbackTimer); _fallbackTimer = null; }
    if (_fallbackResolve){ _fallbackResolve(); _fallbackResolve = null; }
    if (HAS_TTS) speechSynthesis.cancel();
  }
};

function loadVoicesWithRetry(attempt = 0){
  if (!HAS_TTS) return;
  const ok = VOICE.load();
  if (ok) return;
  if (attempt < 10) setTimeout(() => loadVoicesWithRetry(attempt + 1), 300);
}
if (HAS_TTS) speechSynthesis.addEventListener('voiceschanged', () => loadVoicesWithRetry());

function bi(zh, en){
  if (VOICE.mode === 'zh') return zh;
  if (VOICE.mode === 'en') return en;
  return `${zh}<span style="display:block;font-size:.78rem;color:var(--muted);margin-top:2px;">${en}</span>`;
}
function biInline(zh, en){
  if (VOICE.mode === 'zh') return zh;
  if (VOICE.mode === 'en') return en;
  return `${zh} <span style="color:var(--muted);font-size:.85em;">${en}</span>`;
}

(function syncTopbarHeight(){
  const topbar = document.querySelector('.topbar');
  if (!topbar) return;
  const apply = () => document.documentElement
    .style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
  apply();
  if (window.ResizeObserver) new ResizeObserver(apply).observe(topbar);
  else window.addEventListener('resize', apply);
})();

function renderSidebar(){
  const sb = $('sidebar');
  sb.innerHTML = '';
  MENU.forEach(m => {
    if (m.group){
      const g = document.createElement('div');
      g.innerHTML = `<div class="sidebar-group-title">${m.ico} ${biInline(m.zh, m.en)}</div>`;
      sb.appendChild(g);
      MENU.filter(x => x.parent === m.id).forEach(sub => {
        const subBtn = document.createElement('button');
        subBtn.type = 'button';
        subBtn.className = 'sidebar-item sidebar-sub' + (sub.id === currentId ? ' active' : '');
        subBtn.setAttribute('aria-current', sub.id === currentId ? 'true' : 'false');
        subBtn.innerHTML = `<span class="num">${sub.num}</span><span>${biInline(sub.zh, sub.en)}</span>`;
        subBtn.addEventListener('click', () => switchTo(sub.id));
        sb.appendChild(subBtn);
      });
      return;
    }
    if (m.parent) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sidebar-item' + (m.id === currentId ? ' active' : '');
    btn.setAttribute('aria-current', m.id === currentId ? 'true' : 'false');
    btn.innerHTML = `<span class="ico">${m.ico || ''}</span>${m.num ? `<span class="num">${m.num}</span>` : ''}<span>${biInline(m.zh, m.en)}</span>`;
    btn.addEventListener('click', () => switchTo(m.id));
    sb.appendChild(btn);
  });
}

function switchTo(id){
  currentId = id;
  demoIndex = 0;
  lastScrolledSec = -1;
  if (demoOn) exitDemo();
  renderSidebar();
  renderContent();
  window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
}

function buildStepsHtml(sec){
  if (!sec.steps) return '';
  let h = '<div class="step-list">';
  sec.steps.forEach(s => {
    h += `<div class="step-item"><span class="sn">${s.n}</span><span class="st">${bi(s.zh, s.en)}</span></div>`;
  });
  h += '</div>';
  return h;
}

function buildImagesHtml(sec){
  if (!sec.images) return '';
  let h = '';
  sec.images.forEach(img => {
    const path = `images/${img.name}`;
    h += `<div class="img-block" id="img-${img.num}">
      <img src="${path}" alt="${img.content}" loading="lazy" decoding="async"
           onerror="this.style.display='none';this.parentElement.classList.add('img-failed');">
      <div class="img-slot">
        <span class="img-num">📷 ${VOICE.mode === 'en' ? 'Fig' : '圖'} ${img.num}</span>
        <div class="img-name">${path}</div>
        <div class="img-desc">
          <b>${VOICE.mode === 'en' ? 'Content:' : '內容：'}</b>${bi(img.content, img.contentEn || img.content)}<br>
          <b>${VOICE.mode === 'en' ? 'How:' : '怎麼做：'}</b>${bi(img.desc, img.descEn || img.desc)}
          <div class="script">${bi(img.script, img.scriptEn || img.script)}</div>
        </div>
      </div>
    </div>`;
  });
  return h;
}

function renderContent(){
  const mc = $('mainContent');
  const data = CONTENT[currentId];
  if (!data){ mc.innerHTML = '<p>內容載入中...</p>'; return; }

  const savedChecks = [...document.querySelectorAll('.checklist input')].map(i => i.checked);
  const savedY = window.scrollY;

  let html = `<div class="unit-header">
    <div class="badge">📖 ${biInline('單元', 'Unit')}</div>
    <h2>${bi(data.titleZh, data.titleEn)}</h2>
  </div>`;

  data.sections.forEach((sec, idx) => {
    if (sec.why){
      html += `<div class="section" id="sec-${idx}"><div style="background:var(--elev);border-left:4px solid var(--warm);padding:12px 16px;border-radius:8px;font-size:.92rem;line-height:1.8;">${bi(sec.body, sec.bodyEn)}</div></div>`;
      return;
    }

    html += `<div class="section" id="sec-${idx}"><h3>${bi(sec.titleZh, sec.titleEn)}</h3>`;

    // 各段 HTML
    const bodyHtml  = `<p style="line-height:1.9;">${bi(sec.body, sec.bodyEn)}</p>`;
    const goalHtml  = sec.goal ? `<div class="goal">${bi(sec.goal, sec.goalEn || sec.goal)}</div>` : '';
    const mouseHtml = sec.mouseVisual ? buildMouseVisualHtml() : '';
    const stepsHtml = buildStepsHtml(sec);
    const imagesHtml = buildImagesHtml(sec);

    // ★ 有步驟 + 圖片 → 左右分欄（左欄：正文 + 目標 + 滑鼠圖示 + 步驟；右欄：圖片）
    if (stepsHtml && imagesHtml){
      html += `<div class="content-row">
        <div class="left-column">${bodyHtml}${goalHtml}${mouseHtml}${stepsHtml}</div>
        <div class="img-column">${imagesHtml}</div>
      </div>`;
    } else {
      html += bodyHtml + goalHtml + mouseHtml + stepsHtml + imagesHtml;
    }

    if (sec.table){
      html += '<div class="table-wrap"><table class="data-table"><thead><tr>'
            + sec.table.head.map(h => `<th>${h}</th>`).join('')
            + '</tr></thead><tbody>';
      sec.table.rows.forEach(r => { html += '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>'; });
      html += '</tbody></table></div>';
    }

    if (sec.keyboard){
      html += buildKeyboardHtml();
    }

    if (sec.grid){
      html += `<div class="grid-cards">`;
      sec.grid.forEach(g => {
        html += `<div class="mini-card">
          <div class="ico">${g.ico}</div>
          <div class="t">${g.t}</div>
          <div class="s">${g.s}</div>
        </div>`;
      });
      html += `</div>`;
    }

    if (sec.checklist){
      html += '<div class="checklist"><h4>✅ 我可以做到這些嗎？</h4>';
      sec.checklist.forEach(c => {
        html += `<label><input type="checkbox"><span>${c}</span></label>`;
      });
      html += '</div>';
    }

    if (sec.faq){
      html += '<div class="faq">';
      sec.faq.forEach(f => {
        html += `<div class="faq-item"><div class="q">${f.q}</div><div class="a">${f.a}</div></div>`;
      });
      html += '</div>';
    }

    if (sec.refs){
      html += '<div class="ref-grid">';
      sec.refs.forEach(r => {
        html += `<a class="ref-card" href="${r.url}" target="_blank" rel="noopener noreferrer">
          <div class="cat">${r.cat}</div>
          <h4>${biInline(r.title, r.titleEn || r.title)}</h4>
          <div class="url">${r.url}</div>
          <div class="desc">${biInline(r.desc, r.descEn || r.desc)}</div>
        </a>`;
      });
      html += '</div>';
    }

    if (sec.tips){
      sec.tips.forEach(t => {
        html += `<div class="tip">💡 ${bi(t.zh, t.en)}</div>`;
      });
    }

    html += '</div>';
  });

  html += renderVideo(data.video);
  mc.innerHTML = html;

  document.querySelectorAll('.checklist input').forEach((el, i) => {
    if (savedChecks[i]) el.checked = true;
  });
  if (savedY > 0) window.scrollTo({ top: savedY, behavior: 'auto' });
}

function scrollToSection(idx){
  if (idx === undefined || idx === null) return;
  const target = document.getElementById('sec-' + idx);
  if (!target) return;
  document.querySelectorAll('.section').forEach(s => s.classList.remove('focused'));
  target.classList.add('focused');
  const imgs = target.querySelectorAll('img');
  const pending = [...imgs].filter(img => !img.complete);
  if (pending.length > 0){
    Promise.all(pending.map(img => new Promise(res => {
      img.addEventListener('load', res, { once: true });
      img.addEventListener('error', res, { once: true });
    }))).then(() => doScrollEl(target));
  } else {
    doScrollEl(target);
  }
}

function doScrollEl(target){
  const topbar = document.querySelector('.topbar');
  const demoBar = document.getElementById('demoBar');
  const topbarH = topbar ? topbar.getBoundingClientRect().height : 52;
  const demoBarH = (demoBar && demoBar.classList.contains('open'))
                    ? demoBar.getBoundingClientRect().height : 0;
  const viewportH = window.innerHeight;
  const padding = 20;
  const availTop = topbarH + padding;
  const availBottom = viewportH - demoBarH - padding;
  const availH = availBottom - availTop;
  const rect = target.getBoundingClientRect();
  const targetH = rect.height;
  const targetTopAbs = rect.top + window.scrollY;
  let scrollTo;
  if (targetH <= availH){
    const offset = availTop + (availH - targetH) / 2;
    scrollTo = targetTopAbs - offset;
  } else {
    scrollTo = targetTopAbs - availTop;
  }
  window.scrollTo({ top: scrollTo, behavior: reduceMotion() ? 'auto' : 'smooth' });
}

function clearTimers(){ demoTimers.forEach(clearTimeout); demoTimers = []; }
function schedule(fn, d){ const t = setTimeout(fn, d); demoTimers.push(t); return t; }

function playStep(i){
  const data = CONTENT[currentId];
  if (!data || !data.steps || i >= data.steps.length){ finishAll(); return; }
  demoIndex = i;
  clearTimers(); demoToken++;
  const token = demoToken;
  const step = data.steps[i];
  $('caption').innerHTML = bi(step.zh, step.en);
  if (step.sec !== undefined && step.sec !== lastScrolledSec){
    scrollToSection(step.sec);
    lastScrolledSec = step.sec;
  }
  VOICE.speak(step.zh, step.en, () => {
    if (token !== demoToken || !demoPlaying || demoPaused) return;
    schedule(() => {
      if (token !== demoToken || !demoPlaying || demoPaused) return;
      playStep(i + 1);
    }, 400);
  });
}

function startDemo(){
  demoOn = true; demoPlaying = true; demoPaused = false; demoIndex = 0;
  lastScrolledSec = -1;
  $('startBtn').classList.add('on');
  $('startBtn').textContent = '✕ 結束';
  $('demoBar').classList.add('open');
  $('playBtn').textContent = '⏸ 暫停';
  playStep(0);
}

function pauseDemo(){
  demoPaused = true;
  $('playBtn').textContent = '▶ 繼續';
  VOICE.stop();
  clearTimers();
  demoToken++;
}

function resumeDemo(){
  demoPaused = false;
  $('playBtn').textContent = '⏸ 暫停';
  demoToken++;
  const token = demoToken;
  const data = CONTENT[currentId];
  if (!data || !data.steps) return;
  const step = data.steps[demoIndex];
  if (!step) return;
  $('caption').innerHTML = bi(step.zh, step.en);
  if (step.sec !== undefined) scrollToSection(step.sec);
  VOICE.speak(step.zh, step.en, () => {
    if (token !== demoToken || !demoPlaying || demoPaused) return;
    schedule(() => {
      if (token !== demoToken || !demoPlaying || demoPaused) return;
      playStep(demoIndex + 1);
    }, 400);
  });
}

function finishAll(){
  demoPlaying = false; demoPaused = false;
  $('playBtn').textContent = '↻ 重播';
  toast('🎉 完成！');
  setTimeout(() => { if (!demoPlaying) exitDemo(); }, 3000);
}

function exitDemo(){
  demoOn = false; demoPlaying = false; demoPaused = false;
  demoToken++;
  VOICE.stop(); clearTimers();
  lastScrolledSec = -1;
  $('startBtn').classList.remove('on');
  $('startBtn').textContent = '▶ 開始教學';
  $('demoBar').classList.remove('open');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('focused'));
  document.querySelectorAll('.img-block').forEach(s => s.classList.remove('current'));
}

$('startBtn').addEventListener('click', () => { if (demoOn){ exitDemo(); return; } openSetup(); });
$('playBtn').addEventListener('click', () => {
  if (!demoOn){ openSetup(); return; }
  if (!demoPlaying && !demoPaused){ demoIndex = 0; startDemo(); return; }
  if (demoPaused) resumeDemo(); else pauseDemo();
});
$('nextStep').addEventListener('click', () => {
  if (!demoOn) return;
  VOICE.stop(); clearTimers();
  demoPlaying = true; demoPaused = false;
  $('playBtn').textContent = '⏸ 暫停';
  playStep(demoIndex + 1);
});
$('prevStep').addEventListener('click', () => {
  if (!demoOn || demoIndex === 0) return;
  VOICE.stop(); clearTimers();
  demoPlaying = true; demoPaused = false;
  $('playBtn').textContent = '⏸ 暫停';
  playStep(demoIndex - 1);
});
$('exitBtn').addEventListener('click', exitDemo);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('setupModal').classList.contains('show')){
    $('setupModal').classList.remove('show');
  }
});

document.querySelectorAll('#voiceMode button').forEach(btn => {
  btn.addEventListener('click', () => {
    VOICE.mode = btn.dataset.mode;
    document.querySelectorAll('#voiceMode button').forEach(b => b.classList.toggle('active', b === btn));
    renderSidebar(); renderContent();
    if (demoOn && demoPlaying){
      VOICE.stop(); clearTimers();
      demoToken++;
      const token = demoToken;
      const data = CONTENT[currentId];
      const step = data && data.steps && data.steps[demoIndex];
      if (step){
        demoPaused = false;
        $('caption').innerHTML = bi(step.zh, step.en);
        if (step.sec !== undefined) scrollToSection(step.sec);
        VOICE.speak(step.zh, step.en, () => {
          if (token !== demoToken || !demoPlaying || demoPaused) return;
          schedule(() => {
            if (token !== demoToken || !demoPlaying || demoPaused) return;
            playStep(demoIndex + 1);
          }, 400);
        });
      }
    } else {
      VOICE.stop();
    }
  });
});

function openSetup(){
  $('modeSelect').value = VOICE.mode || 'zh';
  const sel = $('voiceSelect');
  sel.innerHTML = '';
  const list = VOICE.all || [];
  if (!list.length){
    const o = document.createElement('option');
    o.value = ''; o.textContent = '（此裝置不支援語音）';
    sel.appendChild(o); sel.disabled = true;
  } else {
    sel.disabled = false;
    list.forEach((v, i) => {
      const o = document.createElement('option');
      o.value = String(i);
      o.textContent = `${v.name} (${v.lang})`;
      sel.appendChild(o);
    });
    const cur = VOICE.mode === 'en' ? VOICE.en : VOICE.zh;
    const idx = cur ? list.indexOf(cur) : 0;
    sel.value = String(idx >= 0 ? idx : 0);
  }
  $('setupModal').classList.add('show');
}
$('cancelBtn').addEventListener('click', () => $('setupModal').classList.remove('show'));
$('confirmBtn').addEventListener('click', () => {
  VOICE.mode = $('modeSelect').value || 'zh';
  VOICE.rate = parseFloat($('speedSelect').value) || 1.0;
  const sel = $('voiceSelect');
  if (!sel.disabled && sel.value !== ''){
    const picked = (VOICE.all || [])[parseInt(sel.value, 10)];
    if (picked){
      if (/^zh/i.test(picked.lang)) VOICE.zh = picked;
      else if (/^en/i.test(picked.lang)) VOICE.en = picked;
    }
  }
  document.querySelectorAll('#voiceMode button').forEach(b => b.classList.toggle('active', b.dataset.mode === VOICE.mode));
  $('setupModal').classList.remove('show');
  renderSidebar(); renderContent();
  startDemo();
});

let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.className = 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2600);
}

(function init(){
  VOICE.rate = 1.0;
  renderSidebar();
  renderContent();
  loadVoicesWithRetry();
})();
</script>
</body>
