  .concept-card h4{margin:0 0 8px;font-size:22px;color:#0f172a}
  .concept-card p{margin:4px 0;font-size:14.5px}

  .code-wrap{position:relative;margin:12px 0;border-radius:10px;overflow:hidden;background:var(--code-bg);display:flex;align-items:stretch;box-shadow:0 4px 12px rgba(15,23,42,.15);min-height:220px}

  .img-slot .placeholder{border:1.5px dashed #475569;border-radius:6px;padding:16px 10px;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#64748b;text-align:center}

  .img-slot .placeholder .label{font-size:12.5px;font-weight:700;color:#94a3b8}

  .code-area{flex:1 1 50%;display:flex;flex-direction:column;min-width:0;position:relative}

  pre{flex:1;margin:0;padding:14px 60px 14px 14px;overflow-x:auto;color:#e2e8f0;font-family:"Fira Code",Consolas,monospace;font-size:13px;line-height:1.65;white-space:pre;tab-size:4}

  .fn{color:#60a5fa}.enum{color:#34d399}.num{color:#fbbf24}.str{color:#f472b6}.kw{color:#a78bfa}.var{color:#22d3ee}.cmt{color:#64748b;font-style:italic}

  .step-warning{background:#fef2f2;border-left:4px solid #ef4444;padding:12px 16px;border-radius:6px;font-size:13.5px;color:#7f1d1d;margin:8px 0 14px}

  details{margin:10px 0 0;border:1px solid var(--border);border-radius:10px;padding:4px 16px;background:#fafaf8}
  details[open]{padding:4px 16px 12px}
  details summary{cursor:pointer;font-weight:700;font-size:13.5px;color:#b45309;list-style:none;padding:10px 0;user-select:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▶ ";font-size:.8em;display:inline-block;transition:transform .2s}

  details p{font-size:13px;margin:6px 0;color:var(--text-light)}
  details.answer{background:#f0fdf4;border-color:#bbf7d0}
  details.answer summary{color:#166534}
  .challenge-section{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:22px 26px;margin-top:18px}
  .challenge-section h3{color:#1e40af;margin-bottom:10px}
  .task{padding:12px 0;border-bottom:1px dashed #c7d2fe;font-size:14px}
  .task:last-child{border-bottom:none}

  .task .box{width:20px;height:20px;border:2px solid #93c5fd;border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;margin-top:3px}
  .task .box.checked{background:#3b82f6;border-color:#3b82f6;color:#fff}
  .page-nav{display:flex;justify-content:space-between;margin-top:24px;gap:10px}
  .page-nav button{font-family:inherit;font-size:14px;background:var(--card-bg);color:#0f172a;border:2px solid var(--primary);padding:10px 24px;border-radius:25px;cursor:pointer;font-weight:600}
  .page-nav button:disabled{opacity:.35;cursor:not-allowed;border-color:#ccc}
  .page-nav button.primary{background:var(--primary);color:#fff}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:40px;cursor:zoom-out;opacity:0;pointer-events:none;transition:opacity .25s}
  .lightbox.show{opacity:1;pointer-events:auto}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;border-radius:8px}
  @media (max-width:820px){aside{position:relative;width:100%;height:auto}main{margin-left:0;padding:20px 16px}.code-wrap{flex-direction:column;min-height:auto}.img-slot{width:100%;aspect-ratio:16/10;border-right:none;border-bottom:2px solid #1e293b}}
</style>
</head>

<script>

const i18n = {

    ],
    intro: {
      title: "🤖 Agent 建造教學 · 5 課",
      subtitle: "概念是主軸，成品是餌。每一課先看到一個「想做的東西」，再學會背後真正重要的程式概念。",
      script_label: "老師講稿 · 開場",
      script: "歡迎來到 Agent 建造課。你有沒有在 Minecraft 裡面看過一個小小的機器人？那個就是 Agent，中文叫代理人。今天我們要學會怎麼指揮它，讓它幫我們蓋東西。這門課分成五堂：第一堂，我們要認識 Agent 的「位置」——它在哪裡、往哪個方向走。第二堂，我們要學「重複」，用一個 for 迴圈，讓程式變短。第三堂，我們要學「方向」——Agent 不用轉身，也能往六個方向走。第四堂，我們把前面三堂合起來，蓋一個正方形，然後學會「除錯」——發現問題、解決問題。第五堂，我們要挑戰進階的「像素畫」，用一格一格的方塊拼出一隻小雞。準備好了嗎？我們開始吧！",
      cards: [
        { icon:"📍", title:"第 1 課 · 位置", desc:"Agent 站在哪一格、怎麼叫它出來、它能走六個方向。" },
        { icon:"🔁", title:"第 2 課 · 重複", desc:"用 for 迴圈簡化重複的動作，蓋出一條斑馬線。" },

      {

        en: "Position",
        badge: "第 1 課",
        concept_label: "今天的核心概念",
        concept_title: "📍 位置",
        concept_lines: [
          "Agent 站在哪一格，可以用程式碼控制。",
          "而且它不只能往前走——它可以走六個方向。",
          "我們用「走十字」來學這個概念。"
        ],
        script_label: "老師講稿 · 第 1 課",
        script: "你有沒有注意到，Agent 不會自己出現？它一開始根本不在這個世界上。所以我們第一步，要用 agent.teleportToPlayer() 這個指令，把它叫到你身邊。可是啊，叫出來以後，它會跟你站在同一格！這樣你根本沒辦法蓋東西。所以第二步，我們要讓它走開——用 agent.move，往前面走個三步。接下來，你有沒有想過，如果我要它往右走呢？你可能會想「那要先叫它右轉」。錯！不用轉身。Agent 可以像螃蟹一樣，直接往右、往左、往上、往下走。這就是今天最重要的概念——位置。Agent 有它自己的方向感，它不用轉身，也能走到六個方向。我們來試試看，讓它走出一個十字。",
        steps: [
          {
            name: "步驟 1：叫出 Agent 並讓它走開",

            img: "images/agent-lesson/lesson1/step1.png",

          },
          {
            name: "步驟 2：前後左右都能走（螃蟹走）",
            command: "around",
            img: "images/agent-lesson/lesson1/step2.png",
            js: `player.onChat("around", function () {\n    agent.teleportToPlayer()\n    agent.move(FORWARD, 2)\n    agent.move(BACK, 4)\n    agent.move(RIGHT, 2)\n    agent.move(LEFT, 4)\n})`,

/* ============================================================
   語法高亮
   ============================================================ */
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function highlight(code,lang){
  const strings=[],comments=[];let c=code;
  c=c.replace(/"(?:[^"\\]|\\.)*"/g,m=>{strings.push(m);return `\u0001S${strings.length-1}\u0001`});
  c=c.replace(/(\/\/|#)[^\n]*/g,m=>{comments.push(m);return `\u0001C${comments.length-1}\u0001`});
  c=escapeHtml(c);
  c=c.replace(/\b(\d+)\b/g,'<span class="num">$1</span>');
  if(lang==='py'){
    c=c.replace(/\b(def|for|in|if|elif|else|while|return|import|from|as|pass|break|continue|class|try|except|finally|with|lambda|yield|global|nonlocal|and|or|not|is|True|False|None)\b/g,'<span class="kw">$1</span>');
    c=c.replace(/\b(range|print|len|int|str|float|list|dict|tuple|set|pos|randint|randpos)\b(?=\s*\()/g,'<span class="fn">$1</span>');
    c=c.replace(/\bdef\s+([a-zA-Z_][a-zA-Z0-9_]*)/g,'<span class="kw">def</span> <span class="fn">$1</span>');
    c=c.replace(/\b([A-Z][A-Z_]{2,})\b/g,'<span class="enum">$1</span>');
    c=c.replace(/\b(i|j|k|h|w|pair|step)\b/g,'<span class="var">$1</span>');
  }else{
    c=c.replace(/\b(function|for|let|const|var|if|else|while|of|in|return|true|false|new|this)\b/g,'<span class="kw">$1</span>');
    c=c.replace(/\b([A-Z][A-Z_]{2,})\b/g,'<span class="enum">$1</span>');
    c=c.replace(/\b([a-z][a-zA-Z]*(?:\.[a-zA-Z]+)+)\b/g,'<span class="fn">$1</span>');
    c=c.replace(/\b(i|j|k|h|w|pair|step)\b/g,'<span class="var">$1</span>');
  }
  c=c.replace(/\u0001S(\d+)\u0001/g,(_,i)=>`<span class="str">${escapeHtml(strings[i])}</span>`);
  c=c.replace(/\u0001C(\d+)\u0001/g,(_,i)=>`<span class="cmt">${escapeHtml(comments[i])}</span>`);
  return c;
}

function createCodeBlock(js,py,imgPath,alt){
  const wrap=document.createElement('div');wrap.className='code-wrap';
  const slot=document.createElement('div');slot.className='img-slot';
  const filename=imgPath?imgPath.split('/').pop():'—';
  const showPlaceholder=()=>{slot.innerHTML=`<div class="placeholder"><div class="icon">🖼️</div><div class="label">${filename}</div>${imgPath?`<div class="path">${imgPath}</div>`:''}</div>`};
  if(imgPath){
    const img=document.createElement('img');
    img.src=imgPath;img.alt=alt||'';img.loading='lazy';
    img.onerror=showPlaceholder;
    img.onclick=e=>{e.stopPropagation();openLightbox(imgPath)};
    slot.appendChild(img);
  }else{showPlaceholder()}
  wrap.appendChild(slot);
  const area=document.createElement('div');area.className='code-area';
  const tabs=document.createElement('div');tabs.className='lang-tabs';
  const tabJS=document.createElement('button');tabJS.className='lang-tab active';tabJS.dataset.lang='js';tabJS.textContent='JavaScript';
  const tabPY=document.createElement('button');tabPY.className='lang-tab';tabPY.dataset.lang='py';tabPY.textContent='Python';
  tabs.appendChild(tabJS);tabs.appendChild(tabPY);area.appendChild(tabs);
  const preJS=document.createElement('pre');preJS.className='lang-js';preJS.innerHTML=`<code>${highlight(js,'js')}</code>`;
  const prePY=document.createElement('pre');prePY.className='lang-py hidden';prePY.innerHTML=`<code>${highlight(py||'','py')}</code>`;
  area.appendChild(preJS);area.appendChild(prePY);wrap.appendChild(area);
  const btn=document.createElement('button');btn.className='copy-btn';btn.textContent=ui().copy;
  btn.onclick=()=>copyCurrentCode(btn);wrap.appendChild(btn);
  return wrap;
}

/* ============================================================
   講稿語音
   ============================================================ */
function speakText(text, btn){
  if(!('speechSynthesis' in window)){alert(ui().not_supported);return}
  if(btn.classList.contains('playing')){
    speechSynthesis.cancel();
    btn.classList.remove('playing');
    btn.textContent=ui().speak_script;
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang = currentLang === 'zh_TW' ? 'zh-TW' : 'en-US';
  u.rate = currentLang === 'zh_TW' ? 0.95 : 0.9;
  u.pitch = 1.0;
  btn.classList.add('playing');
  btn.textContent = ui().speaking;
  u.onend=u.onerror=()=>{
    btn.classList.remove('playing');
    btn.textContent = ui().speak_script;
  };
  speechSynthesis.speak(u);
}

function createScriptBlock(label, script){
  const div=document.createElement('div');div.className='teacher-script';

  const span=document.createElement('span');span.textContent='📖 '+label;
  const btn=document.createElement('button');btn.className='speak-btn';btn.textContent=ui().speak_script;
  btn.onclick=()=>speakText(script,btn);
  lab.appendChild(span);lab.appendChild(btn);
  const txt=document.createElement('div');txt.className='text';txt.textContent=script;
  div.appendChild(lab);div.appendChild(txt);
  return div;
}

function createLessonCard(lesson){
  const sec=document.createElement('section');sec.className='card';sec.id=lesson.id;
  const h=document.createElement('h2');
  h.innerHTML=`${lesson.title} <span style="font-size:15px;color:#3b82f6;font-weight:500;">${lesson.en}</span>`;
  sec.appendChild(h);
  const badge=document.createElement('div');
  badge.style.cssText='display:inline-block;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;margin-bottom:14px;';
  badge.textContent=lesson.badge;
  sec.appendChild(badge);

  sec.appendChild(createScriptBlock(lesson.script_label, lesson.script));

  const cc=document.createElement('div');cc.className='concept-card';
  cc.innerHTML=`<div class="label">${lesson.concept_label}</div><h4>${lesson.concept_title}</h4>${lesson.concept_lines.map(l=>`<p>${l}</p>`).join('')}`;
  sec.appendChild(cc);

  lesson.steps.forEach((step,idx)=>{
    const h4=document.createElement('h4');h4.className='sub';
    h4.innerHTML=`<span class="step-num">${idx+1}</span>${step.name}`;
    sec.appendChild(h4);
    if(step.warning){
      const w=document.createElement('div');w.className='step-warning';
      w.textContent='⚠️ '+step.warning;sec.appendChild(w);
    }
    if(step.command){
      const row=document.createElement('div');row.className='cmd-row';
      row.innerHTML=`<span class="cmd-label">${ui().chat_label}</span><span class="cmd-code">${step.command}</span><button class="cmd-copy-btn">${ui().copy_cmd}</button>`;
      row.querySelector('.cmd-copy-btn').onclick=e=>copyText(step.command,e.target);
      sec.appendChild(row);
    }
    sec.appendChild(createCodeBlock(step.js,step.py,step.img,step.name));
    if(step.done){
      const d=document.createElement('div');d.className='done-box';
      d.textContent='🎉✅ '+step.done;sec.appendChild(d);
    }
    if(step.why&&step.why.length){
      const de=document.createElement('details');
      const su=document.createElement('summary');su.textContent=ui().why;de.appendChild(su);
      step.why.forEach(txt=>{const p=document.createElement('p');p.textContent=txt;de.appendChild(p)});
      sec.appendChild(de);
    }
  });

  if(lesson.challenges&&lesson.challenges.length){
    const cs=document.createElement('div');cs.className='challenge-section';
    cs.innerHTML=`<h3>${ui().challenge}</h3>`;
    lesson.challenges.forEach((ch,i)=>{
      const task=document.createElement('div');task.className='task';
      const head=document.createElement('div');head.className='task-head';
      head.innerHTML=`<div class="box" data-task="${lesson.id}-${i}">✓</div><div style="flex-shrink:0;font-size:13px;">${ch.stars}</div><div>${ch.text}</div>`;
      task.appendChild(head);
      if(ch.answerJS||ch.answerPY){
        const de=document.createElement('details');de.className='answer';
        const su=document.createElement('summary');su.textContent=ui().answer;de.appendChild(su);
        if(ch.hint){
          const hint=document.createElement('p');hint.textContent='💡 '+ch.hint;
          hint.style.cssText='font-size:13px;color:#166534;background:#dcfce7;padding:10px 14px;border-radius:8px;margin:6px 0 12px;';
          de.appendChild(hint);
        }
        const img=`images/agent-lesson/${lesson.id}/answer${i+1}.png`;
        de.appendChild(createCodeBlock(ch.answerJS||'',ch.answerPY||'',img,ch.text));
        task.appendChild(de);
      }
      cs.appendChild(task);
    });
    sec.appendChild(cs);
  }
  return sec;
}

    [0,0,23,0,23,0,0]
  ];
  const colorMap={0:'#1e293b',4:'#111827',23:'#fb923c',24:'#fbbf24',32:'#f9a8d4'};
  pattern.forEach(row=>{
    row.forEach(cell=>{
      const d=document.createElement('div');
      d.style.cssText=`aspect-ratio:1;border-radius:4px;background:${colorMap[cell]};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${cell===4?'#fff':'#000'};`;
      if(cell) d.textContent=cell;
      grid.appendChild(d);
    });
  });
  gridBox.appendChild(grid);
  chickWrap.appendChild(gridBox);

  // 圖例
  const legend=document.createElement('div');
  legend.style.cssText='flex:1 1 240px;';
  p.block_legend.forEach(b=>{
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:10px;padding:10px;background:#f8fafc;border-radius:8px;margin-bottom:8px;';
    row.innerHTML=`<span style="width:28px;height:28px;border-radius:6px;background:${b.color};border:2px solid #e2e8f0;"></span><span style="font-family:monospace;font-weight:700;color:#0f172a;width:32px;">${b.code}</span><span style="font-size:13.5px;color:#475569;">${b.name}</span>`;
    legend.appendChild(row);
  });
  chickWrap.appendChild(legend);
  c2.appendChild(chickWrap);
  div.appendChild(c2);

  // 八層說明
  const c3=document.createElement('div');c3.className='card';
  c3.innerHTML=`<h3 style="color:#0f172a;font-size:18px;margin-bottom:8px;">${p.layers_title}</h3><p style="color:#64748b;font-size:14px;line-height:1.8;">${p.layers_desc}</p>`;
  div.appendChild(c3);

  // CTA
  const c4=document.createElement('div');c4.className='card';
  c4.style.textAlign='center';
  c4.innerHTML=`<h3 style="color:#0f172a;font-size:18px;margin-bottom:8px;">${p.cta_title}</h3><p style="color:#64748b;font-size:14px;margin-bottom:18px;">${p.cta_desc}</p>`;
  const btn=document.createElement('a');
  btn.href=p.cta_href;
  btn.textContent=p.cta_btn;
  btn.style.cssText='display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#4CAF50,#388E3C);color:#fff;text-decoration:none;padding:14px 32px;border-radius:30px;font-weight:700;font-size:16px;box-shadow:0 4px 15px rgba(76,175,80,.4);transition:all .2s;';
  btn.onmouseenter=()=>btn.style.filter='brightness(1.1)';
  btn.onmouseleave=()=>btn.style.filter='';
  c4.appendChild(btn);
  div.appendChild(c4);

  // 導覽
  const nav=document.createElement('div');nav.className='page-nav';
  const btnPrev=document.createElement('button');
  btnPrev.textContent=p.back_btn;
  btnPrev.onclick=()=>showPage('lesson4');
  nav.appendChild(btnPrev);
  nav.appendChild(document.createElement('span'));
  div.appendChild(nav);

  return div;
}

/* ============================================================
   側邊欄
   ============================================================ */
function renderSidebar(){
  document.getElementById('sidebarTitle').textContent=t('sidebar_title');
  document.getElementById('sidebarSubtitle').textContent=t('sidebar_subtitle');
  document.getElementById('progressLabel').textContent=t('progress_label');
  const nav=document.getElementById('navList');
  nav.innerHTML='';
  currentI18n().nav.forEach((item,idx)=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(item.id===currentPageId?' active':'');
    btn.innerHTML=`<span class="num">${idx}</span><span>${item.label}</span>`;
    btn.onclick=()=>showPage(item.id);
    nav.appendChild(btn);
  });
  const idx=currentI18n().nav.findIndex(n=>n.id===currentPageId);
  document.getElementById('progressText').textContent=`${idx+1} / ${currentI18n().nav.length}`;
  document.getElementById('progressFill').style.width=`${((idx+1)/currentI18n().nav.length)*100}%`;
}

/* ============================================================
   切換頁面 / 語言
   ============================================================ */
function showPage(id){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  currentPageId=id;
  const main=document.getElementById('mainContent');
  main.innerHTML='';
  let page;
  if(id==='intro')       page=renderIntroPage();
  else if(id==='pixel')  page=renderPixelPage();
  else {
    const lesson=currentI18n().lessons.find(l=>l.id===id);
    page=lesson?renderLessonPage(lesson):renderIntroPage();
  }
  main.appendChild(page);
  bindAll();
  renderSidebar();
  window.scrollTo({top:0,behavior:'smooth'});
}

function switchLang(lang){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  currentLang=lang;
  localStorage.setItem('agent_lesson_lang',lang);
  document.documentElement.lang=(lang==='zh_TW')?'zh-Hant':'en';
  document.getElementById('langSelect').value=lang;
  showPage(currentPageId);
}

/* ============================================================
   事件綁定
   ============================================================ */
function bindAll(){
  document.querySelectorAll('.lang-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      const wrap=tab.closest('.code-wrap');
      const lang=tab.dataset.lang;
      wrap.querySelectorAll('.lang-tab').forEach(t=>t.classList.toggle('active',t===tab));
      wrap.querySelector('.lang-js').classList.toggle('hidden',lang!=='js');
      wrap.querySelector('.lang-py').classList.toggle('hidden',lang!=='py');
    });
  });
  const saved=JSON.parse(localStorage.getItem('agent_lesson_tasks')||'{}');
  document.querySelectorAll('.task .box').forEach(box=>{
    const id=box.dataset.task;
    if(saved[id])box.classList.add('checked');
    box.onclick=()=>{
      box.classList.toggle('checked');
      saved[id]=box.classList.contains('checked');
      localStorage.setItem('agent_lesson_tasks',JSON.stringify(saved));
    };
  });
}

/* ============================================================
   複製
   ============================================================ */
function copyCurrentCode(btn){
  const wrap=btn.closest('.code-wrap');
  const pre=wrap.querySelector('pre:not(.hidden)');
  if(!pre)return;
  const text=pre.innerText;
  const done=()=>{btn.classList.add('copied');btn.innerHTML=ui().copied;setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML=ui().copy},1800)};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
}
function copyText(text,btn){
  const done=()=>{btn.classList.add('copied');btn.textContent=ui().copied_cmd;setTimeout(()=>{btn.classList.remove('copied');btn.textContent=ui().copy_cmd},1800)};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');cb()}catch(e){}
  document.body.removeChild(ta);
}

/* ============================================================
   初始化
   ============================================================ */
document.getElementById('langSelect').value=currentLang;
document.documentElement.lang=(currentLang==='zh_TW')?'zh-Hant':'en';
showPage('intro');
</script>
