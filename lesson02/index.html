<!DOCTYPE html>

<title>Minecraft 第一夜：AI 冒險指南</title>
<script>
window.addEventListener('error', (e) => { console.error('錯誤：', e); });
document.addEventListener('DOMContentLoaded', () => {
    const setupImgError = (img) => {
        if (img.dataset.errorHandled) return;
        img.dataset.errorHandled = '1';
        img.addEventListener('error', function() {
            const fileName = this.getAttribute('src') || '未知檔名';
            const placeholder = document.createElement('div');
            placeholder.style.cssText = `display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;aspect-ratio:16/10;background:#ffe0e0;border:3px dashed #e53935;border-radius:8px;color:#c62828;font-weight:bold;font-size:1.1em;padding:20px;text-align:center;margin:8px 0;`;
            placeholder.innerHTML = `<div style="font-size:2.5em;margin-bottom:10px;">❌</div><div style="font-size:1.2em;margin-bottom:6px;">找不到圖片</div><div style="font-family:'Courier New',monospace;font-size:1.1em;background:#fff;padding:6px 14px;border-radius:6px;color:#b71c1c;">${fileName}</div>`;
            this.parentNode.replaceChild(placeholder, this);
        });
    };
    const scanImages = () => { document.querySelectorAll('img').forEach(setupImgError); };
    scanImages();
    const observer = new MutationObserver(scanImages);
    observer.observe(document.body, { childList: true, subtree: true });
});
</script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .code-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }

    .tour-header { flex: 1 1 320px; min-width: 0; }

    .tour-start-btn { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #4CAF50, #388E3C); color: #fff; border: none; padding: 13px 28px; border-radius: 30px; font-family: inherit; font-size: 1em; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(76,175,80,0.4); transition: all 0.25s; flex-shrink: 0; white-space: nowrap; }

    .tour-cursor { position: fixed; width: 44px; height: 44px; z-index: 10002; pointer-events: none; transform: translate(-50%, -50%); transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    .tour-cursor::before { content: ""; display: block; width: 100%; height: 100%; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" stroke="%23333" stroke-width="1.5"><path d="M3 2l7.07 18.97 2.12-7.07 7.07-2.12L3 2z"/></svg>') no-repeat center center; background-size: contain; }

    .page-nav { display: flex; justify-content: space-between; max-width: 1000px; margin: 0 auto; gap: 10px; }
    .page-nav button { font-family: inherit; font-size: 0.95em; background: var(--card-bg); color: var(--text-heading); border: 2px solid var(--primary); padding: 10px 24px; border-radius: 25px; cursor: pointer; }

</style>
</head>
<body>

<button class="export-btn" onclick="exportHTML()">💾 匯出 HTML</button>
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h3>🎮 第一夜</h3>
        <p id="sidebarSubtitle">我的 AI 冒險指南</p>
        <select class="lang-select" id="langSelect" onchange="switchLang(this.value)">
            <option value="zh_TW">繁體中文</option>
            <option value="en_US">English</option>
        </select>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
        <div class="progress-label">
            <span id="progressLabel">冒險進度</span>
            <span id="progressText">第 1 頁 / 共 8 頁</span>
        </div>
        <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>

    </div>

<main class="main-content" id="mainContent"></main>

<footer style="text-align:center;padding:20px;color:#888;font-size:0.85em;margin-left:270px;">
    <p>© 2026 Minecraft 第一夜 AI 冒險指南 | 本教材僅供教育用途</p>
</footer>

<div class="tour-overlay" id="tourOverlay">
    <div class="tour-spotlight" id="tourSpotlight"></div>
    <div class="tour-cursor" id="tourCursor"></div>
</div>

<div class="tour-panel" id="tourPanel">
    <div class="sound-wave" id="soundWave">
        <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="tour-panel-btns">
        <button class="tour-panel-btn tour-panel-btn-skip" onclick="endTour()">跳過</button>
        <button class="tour-panel-btn tour-panel-btn-pause" id="tourPauseBtn" onclick="toggleTourPause()">⏸</button>
        <button class="tour-panel-btn tour-panel-btn-next" onclick="nextTourStep()">下一步</button>
    </div>
</div>

<script>
/* ============================================================
   全域狀態
   ============================================================ */
let currentLang = 'zh_TW';
let currentPage = 0;
let isSpeaking = false;
let allVoices = [];

/* 中文雙聲音 */
let voiceZhAgent = null, voiceZhPlayer = null;
/* 英文雙聲音 */
let voiceEnAgent = null, voiceEnPlayer = null;

function getChineseVoice() {
    return allVoices.find(v => /zh-(tw|hk)/i.test(v.lang))
        || allVoices.find(v => /^zh/i.test(v.lang)) || null;
}
function getEnglishVoice() {
    return allVoices.find(v => /en-(us|gb)/i.test(v.lang))
        || allVoices.find(v => /^en/i.test(v.lang)) || null;
}

function loadVoices() {
    allVoices = speechSynthesis.getVoices();

    /* 中文 pair */
    const zh = allVoices.filter(x => x.lang.toLowerCase().startsWith('zh'));
    if (zh.length >= 2) {
        voiceZhAgent = zh[0];
        voiceZhPlayer = zh.find(x => x.voiceURI !== zh[0].voiceURI) || zh[0];
    } else if (zh.length === 1) {
        voiceZhAgent = voiceZhPlayer = zh[0];
    } else {
        voiceZhAgent = voiceZhPlayer = null;
    }

    /* 英文 pair */
    const en = allVoices.filter(x => x.lang.toLowerCase().startsWith('en'));
    if (en.length >= 2) {
        voiceEnAgent = en[0];
        voiceEnPlayer = en.find(x => x.voiceURI !== en[0].voiceURI) || en[0];
    } else if (en.length === 1) {
        voiceEnAgent = voiceEnPlayer = en[0];
    } else {
        voiceEnAgent = voiceEnPlayer = null;
    }
}
if (typeof speechSynthesis.onvoiceschanged !== 'undefined') speechSynthesis.onvoiceschanged = loadVoices;
(function waitVoices(retry) {
    retry = retry || 0;
    if (speechSynthesis.getVoices().length || retry > 20) { loadVoices(); return; }
    setTimeout(() => waitVoices(retry + 1), 250);
})();

/* ============================================================
   導覽邏輯
   ============================================================ */
let tourActive = false;
let tourStepIndex = 0;
let tourPaused = false;
let tourFallbackTimer = null;
const TOUR_FALLBACK_MS = 30000;

function speakTourText(text, onDone) {
    speechSynthesis.cancel();
    const wave = document.getElementById('soundWave');
    if (wave) wave.classList.add('playing');

    setTimeout(() => {
        if (!text) {
            if (wave) wave.classList.remove('playing');
            if (onDone) onDone();
            return;
        }
        const u = new SpeechSynthesisUtterance(text);
        if (currentLang === 'zh_TW') {
            u.lang = 'zh-TW';
            const v = getChineseVoice();
            if (v) u.voice = v;
            u.pitch = 1.05;
            u.rate = 1.15;
        } else {
            u.lang = 'en-US';
            const v = getEnglishVoice();
            if (v) u.voice = v;
            u.pitch = 1.0;
            u.rate = 0.95;
        }
        let advanced = false;
        const advance = () => {
            if (advanced) return;
            advanced = true;
            if (wave) wave.classList.remove('playing');
            if (onDone) onDone();
        };
        u.onend = advance;
        u.onerror = advance;
        speechSynthesis.speak(u);
    }, 400);
}

function startTour() {
    if (isSpeaking) stopSpeaking();
    if (currentPage !== 0) {
        showPage(0);
        setTimeout(_beginTour, 700);
    } else {
        _beginTour();
    }
}

function _beginTour() {
    tourActive = true;
    tourStepIndex = 0;
    tourPaused = false;
    document.getElementById('tourOverlay').classList.add('active');
    document.getElementById('tourPanel').classList.add('active');
    document.getElementById('tourPauseBtn').textContent = '⏸';
    goToTourStep(0);
}

function goToTourStep(index) {
    if (!tourActive) return;
    const steps = t('tour_steps');
    if (index >= steps.length) { endTour(); return; }
    tourStepIndex = index;
    const step = steps[index];
    const myIndex = index;

    clearTimeout(tourFallbackTimer);

    speakTourText(step.text, () => {
        if (!tourActive || tourPaused) return;
        if (tourStepIndex !== myIndex) return;
        setTimeout(() => {
            if (tourActive && !tourPaused && tourStepIndex === myIndex) {
                goToTourStep(tourStepIndex + 1);
            }
        }, 600);
    });

    tourFallbackTimer = setTimeout(() => {
        if (tourActive && !tourPaused && tourStepIndex === myIndex) {
            speechSynthesis.cancel();
            goToTourStep(tourStepIndex + 1);
        }
    }, TOUR_FALLBACK_MS);

    if (!step.target) {
        document.getElementById('tourSpotlight').style.width = '0px';
        document.getElementById('tourSpotlight').style.height = '0px';
        document.getElementById('tourCursor').style.opacity = '0';
        return;
    }

    const el = document.querySelector(step.target);
    if (!el) { goToTourStep(index + 1); return; }

    el.scrollIntoView({ behavior: 'smooth', block: 'center' });

    setTimeout(() => {
        if (!tourActive || tourStepIndex !== myIndex) return;
        const rect = el.getBoundingClientRect();
        const padding = 12;
        const sp = document.getElementById('tourSpotlight');
        sp.style.left = (rect.left - padding) + 'px';
        sp.style.top = (rect.top - padding) + 'px';
        sp.style.width = (rect.width + padding * 2) + 'px';
        sp.style.height = (rect.height + padding * 2) + 'px';

        const cursor = document.getElementById('tourCursor');
        cursor.style.left = (rect.left + rect.width / 2) + 'px';
        cursor.style.top = (rect.top + rect.height / 2) + 'px';
        cursor.style.opacity = '1';
    }, 700);
}

function nextTourStep() {
    clearTimeout(tourFallbackTimer);
    speechSynthesis.cancel();
    document.getElementById('soundWave').classList.remove('playing');
    goToTourStep(tourStepIndex + 1);
}

function toggleTourPause() {
    tourPaused = !tourPaused;
    document.getElementById('tourPauseBtn').textContent = tourPaused ? '▶' : '⏸';
    const wave = document.getElementById('soundWave');
    if (tourPaused) {
        clearTimeout(tourFallbackTimer);
        speechSynthesis.cancel();
        if (wave) wave.classList.remove('playing');
    } else {
        const step = t('tour_steps')[tourStepIndex];
        if (!step) return;
        const myIndex = tourStepIndex;
        if (wave) wave.classList.add('playing');
        speakTourText(step.text, () => {
            if (!tourActive || tourPaused) return;
            if (tourStepIndex !== myIndex) return;
            setTimeout(() => {
                if (tourActive && !tourPaused && tourStepIndex === myIndex) {
                    goToTourStep(tourStepIndex + 1);
                }
            }, 600);
        });
        clearTimeout(tourFallbackTimer);
        tourFallbackTimer = setTimeout(() => {
            if (tourActive && !tourPaused && tourStepIndex === myIndex) {
                speechSynthesis.cancel();
                goToTourStep(tourStepIndex + 1);
            }
        }, TOUR_FALLBACK_MS);
    }
}

function endTour() {
    tourActive = false;
    tourPaused = false;
    clearTimeout(tourFallbackTimer);
    speechSynthesis.cancel();
    document.getElementById('tourOverlay').classList.remove('active');
    document.getElementById('tourPanel').classList.remove('active');
    document.getElementById('soundWave').classList.remove('playing');
}

/* ============================================================
   對話語音：中文 / 英文都用「雙聲音」區分 Agent 與 Player
   ============================================================ */
function initSpeakButtons() {
    document.querySelectorAll('.dialogue').forEach(dialogue => {
        if (dialogue.querySelector('.speak-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'speak-btn';
        btn.textContent = currentLang === 'zh_TW' ? '▶ 播放對話' : '▶ Play';
        btn.onclick = () => toggleSpeak(dialogue, btn);
        dialogue.appendChild(btn);
    });
}

function toggleSpeak(dialogue, btn) {
    if (isSpeaking) { stopSpeaking(); return; }
    const lines = dialogue.querySelectorAll('.dialogue-line');
    if (lines.length === 0) return;
    isSpeaking = true;
    btn.classList.add('playing');
    btn.textContent = currentLang === 'zh_TW' ? '⏸ 停止' : '⏸ Stop';
    playLines(lines, 0, btn, dialogue);
}

function playLines(lines, index, btn, dialogueEl) {
    if (index >= lines.length || !isSpeaking) { stopSpeaking(); return; }
    const line = lines[index];
    const bubble = line.querySelector('.bubble');
    const speaker = line.querySelector('.speaker');
    if (!bubble) { playLines(lines, index + 1, btn, dialogueEl); return; }
    if (dialogueEl) dialogueEl.querySelectorAll('.dialogue-line').forEach(l => l.classList.remove('speaking'));
    line.classList.add('speaking');
    const rect = line.getBoundingClientRect();
    if (rect.top < 100 || rect.bottom > window.innerHeight - 100) line.scrollIntoView({ behavior: 'smooth', block: 'center' });

    const isZh = currentLang === 'zh_TW';
    const isAgent = speaker && speaker.classList.contains('agent');
    const text = bubble.textContent.trim();
    const u = new SpeechSynthesisUtterance(text);

    if (isZh) {
        u.lang = 'zh-TW';
        const voice = isAgent ? voiceZhAgent : voiceZhPlayer;
        if (voice) u.voice = voice;
        const sameVoice = voiceZhAgent && voiceZhPlayer && voiceZhAgent.voiceURI === voiceZhPlayer.voiceURI;
        if (isAgent) {
            u.pitch = sameVoice ? 0.6 : 0.95;
            u.rate = 1.25;
        } else {
            u.pitch = sameVoice ? 1.4 : 1.05;
            u.rate = 1.45;
        }
    } else {
        u.lang = 'en-US';
        const voice = isAgent ? voiceEnAgent : voiceEnPlayer;
        if (voice) u.voice = voice;
        const sameVoice = voiceEnAgent && voiceEnPlayer && voiceEnAgent.voiceURI === voiceEnPlayer.voiceURI;
        if (isAgent) {
            u.pitch = sameVoice ? 0.7 : 1.0;
            u.rate = sameVoice ? 0.85 : 0.95;
        } else {
            u.pitch = sameVoice ? 1.3 : 1.0;
            u.rate = sameVoice ? 1.0 : 1.05;
        }
    }

    let advanced = false;
    const advance = () => {
        if (advanced) return;
        advanced = true;
        setTimeout(() => playLines(lines, index + 1, btn, dialogueEl), 120);
    };
    u.onend = advance;
    u.onerror = advance;
    speechSynthesis.speak(u);
}

function stopSpeaking() {
    isSpeaking = false;
    speechSynthesis.cancel();
    document.querySelectorAll('.speak-btn').forEach(b => {
        b.classList.remove('playing');
        b.textContent = currentLang === 'zh_TW' ? '▶ 播放對話' : '▶ Play';
    });
    document.querySelectorAll('.dialogue-line').forEach(l => l.classList.remove('speaking'));
}

function switchLang(lang) {
    if (tourActive) endTour();
    if (isSpeaking) stopSpeaking();
    currentLang = lang;
    localStorage.setItem('preferredLang', lang);
    loadVoices();
    init();
}

function t(key) { return i18n[currentLang][key]; }
function tx(obj) { return obj[currentLang] || obj.zh_TW; }

function renderDialogue(key) {
    const lines = i18n[currentLang].dialogues[key];
    if (!lines) return '';
    const topics = i18n[currentLang].dialogue_topics || {};
    const topic = topics[key] || t('dialogue_title');
    const linesHtml = lines.map(l => `
        <div class="dialogue-line ${l.who}">
            <div class="speaker ${l.who}">${l.who === 'agent' ? t('agent') : t('player')}</div>
            <div class="bubble">${l.text}</div>
        </div>`).join('');
    return `<div class="dialogue" data-dialogue><div class="dialogue-title">${topic}</div>${linesHtml}</div>`;
}

function renderImageBlock(images) {
    if (!images || images.length === 0) return '';
    const desc = imageDescriptions[currentLang];
    const items = images.map(img => {
        const k = img.replace('.jpg', '');
        return `<div class="image-item"><img src="${img}" alt="${k}" loading="lazy"><div class="image-item-text"><strong>${k.toUpperCase()}</strong>${desc[k] || ''}</div></div>`;
    }).join('');
    return `<div class="image-block"><div class="image-row">${items}</div></div>`;
}

function renderCodeBlock(codes) {
    if (!codes || codes.length === 0) return '';
    const desc = codeDescriptions[currentLang];
    const items = codes.map(code => {
        const k = code.replace('.jpg', '');
        return `<div class="code-item"><img src="${code}" alt="${k}" loading="lazy"><div class="code-item-text"><strong>${k.toUpperCase()}</strong>${desc[k] || ''}</div></div>`;
    }).join('');
    return `<div class="code-block"><div class="code-block-title">💻 ${t('code_title')}</div><div class="code-row">${items}</div></div>`;
}

function renderTourBlock() {
    return `<div class="tour-block"><div class="tour-header"><h2>${t('tour_title')}</h2><p>${t('tour_subtitle')}</p></div><button class="tour-start-btn" onclick="startTour()">${t('tour_start_btn')}</button></div>`;
}

function renderQuiz(quiz, pageIndex) {
    if (!quiz) return '';
    const answered = quizAnswers['page' + pageIndex];
    const options = tx(quiz.options);
    const optionsHtml = options.map((opt, i) => {
        let cls = 'quiz-option';
        if (answered !== undefined) {
            if (i === quiz.correct) cls += ' correct';
            else if (i === answered && answered !== quiz.correct) cls += ' wrong';
        }
        return `<button class="${cls}" onclick="answerQuiz(${pageIndex}, ${i}, ${quiz.correct})" ${answered !== undefined ? 'disabled' : ''}>${opt}</button>`;
    }).join('');
    const fb = answered !== undefined ? (answered === quiz.correct ? 'correct' : 'wrong') : '';
    const fbText = answered !== undefined ? (answered === quiz.correct ? t('correct') : t('wrong')) : '';
    return `<div class="quiz-question" style="font-weight:bold;margin-bottom:10px;">${tx(quiz.question)}</div><div class="quiz-options">${optionsHtml}</div><div class="quiz-feedback ${fb} ${answered !== undefined ? 'show' : ''}">${fbText}</div>`;
}

        risk_title: "⚠️ AI Is Not Perfect", risk_items: ["<strong>AI makes mistakes</strong>", "<strong>AI has bias</strong>", "<strong>AI needs supervision</strong>"],
        think_title: "💭 Think About It", think_items: ["How do you define AI?", "What's your favorite part?", "How do you use AI?", "How did you train the Agent?", "Why is verification important?"],
        quiz_title: "📝 Learning Quiz", quiz_items: ["What is AI?", "Match concepts.", "What did you teach?", "Why check AI's work?", "How can AI help you?"]
    };

    return `
        <div class="card">
            <h2>${currentLang === 'zh_TW' ? '🎉 任務完成！' : '🎉 Task Complete!'}</h2>
            ${renderImageBlock(['image017.jpg', 'image018.jpg'])}
            <p>${texts.p1}</p>
            ${doneDialogue}
        </div>
        <div class="card"><h2>${texts.ext_title}</h2><p>${texts.ext_p}</p></div>
        <div class="card"><div class="ethics"><h3>${texts.ethics_title}</h3><p>${texts.ethics_p}</p><ul>${texts.ethics_items.map(i => `<li>${i}</li>`).join('')}</ul><p>${texts.ethics_end}</p></div></div>
        <div class="card"><h2>${texts.risk_title}</h2><ul>${texts.risk_items.map(i => `<li>${i}</li>`).join('')}</ul></div>
        <div class="card"><h2>${texts.think_title}</h2><ul>${texts.think_items.map(i => `<li>${i}</li>`).join('')}</ul></div>
        <div class="card"><h2>${texts.quiz_title}</h2><ol>${texts.quiz_items.map(i => `<li>${i}</li>`).join('')}</ol></div>
    `;
}

function answerQuiz(pageIndex, selected, correct) {
    if (quizAnswers['page' + pageIndex] !== undefined) return;
    quizAnswers['page' + pageIndex] = selected;
    try { localStorage.setItem('mc_quiz_answers', JSON.stringify(quizAnswers)); } catch (e) {}
    renderPage(currentPage);
}

function showPage(index) {
    if (index < 0 || index >= totalPages) return;
    if (tourActive) endTour();
    if (isSpeaking) stopSpeaking();
    currentPage = index;
    renderPage(index);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changePage(step) {
    const next = currentPage + step;
    if (next >= 0 && next < totalPages) showPage(next);
}

function updateProgress() {
    const percent = ((currentPage + 1) / totalPages * 100);
    document.getElementById('progressFill').style.width = percent + '%';
    const completed = Object.keys(quizAnswers).filter(k => {
        const idx = parseInt(k.replace('page', ''));
        return pages[idx] && pages[idx].quiz && quizAnswers[k] === pages[idx].quiz.correct;
    }).length;
    const totalQuizzes = pages.filter(p => p.quiz).length;
    document.getElementById('progressText').textContent = currentLang === 'zh_TW'
        ? `第 ${currentPage + 1} 頁 / 共 ${totalPages} 頁（答對 ${completed}/${totalQuizzes} 題）`
        : `Page ${currentPage + 1} / ${totalPages} (${completed}/${totalQuizzes} correct)`;
}

function updateSidebar() {
    const nav = document.getElementById('sidebarNav');
    nav.innerHTML = '';
    i18n[currentLang].tasks.forEach((task, i) => {
        const btn = document.createElement('button');
        btn.className = i === currentPage ? 'active' : '';
        btn.innerHTML = `<span class="num">${i}</span> ${task}`;
        btn.onclick = () => showPage(i);
        nav.appendChild(btn);
    });
}

function renderPage(index) {
    const page = pages[index];
    const main = document.getElementById('mainContent');
    let content = '';
    if (page.type === 'intro') content = renderIntroPage();
    else if (page.type === 'done') content = renderDonePage();
    else content = renderTaskPage(page);

    main.innerHTML = `<div class="page active" id="${page.id}">${content}</div>
        <div class="page-nav">
            <button onclick="changePage(-1)" ${index === 0 ? 'disabled' : ''}>${t('prev')}</button>
            <button onclick="changePage(1)" ${index === totalPages - 1 ? 'disabled' : ''} class="primary">${t('next')}</button>
        </div>`;
    initSpeakButtons();
    updateProgress();
    updateSidebar();
}

function init() {
    document.getElementById('sidebarSubtitle').textContent = t('sidebar_subtitle');
    document.getElementById('progressLabel').textContent = t('progress_label');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('darkBtn').textContent = isDark ? t('dark_off') : t('dark_on');
    document.getElementById('langSelect').value = currentLang;
    updateSidebar();
    renderPage(currentPage);
    updateProgress();
}

function toggleDark() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('darkBtn').textContent = isDark ? t('dark_off') : t('dark_on');
}
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
}
window.addEventListener('scroll', () => {
    const btn = document.getElementById('backTop');
    if (window.scrollY > 300) btn.classList.add('show');
    else btn.classList.remove('show');
});
document.addEventListener('keydown', (e) => {
    if (!tourActive) return;
    if (e.key === 'Escape') endTour();
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextTourStep(); }
    if (e.key === 'p' || e.key === 'P') toggleTourPause();
});
function exportHTML() {
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'minecraft-first-night.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

window.addEventListener('load', () => {
    const saved = localStorage.getItem('preferredLang');
    if (saved) currentLang = saved;
    init();
});
</script>

</body>
</html>
