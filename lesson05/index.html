<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎃 Halloween Workshop｜萬聖節角色館</title>
<style>
:root{
  --orange:#ff8a1e;
  --orange-soft:#ffb454;
  --purple:#a02bff;
  --ink:#f4e9ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Microsoft JhengHei","PingFang TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(255,122,24,.20), transparent 60%),
    radial-gradient(900px 500px at 100% 100%, rgba(140,60,255,.18), transparent 60%),
    linear-gradient(180deg,#0b0414 0%,#150827 45%,#0a0412 100%);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}

/* canvas 星光 */
#sparkles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* 滑鼠光暈 */
.spotlight{
  position:fixed;top:0;left:0;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,150,50,.10),transparent 62%);
  pointer-events:none;z-index:0;will-change:transform;
}

/* 月亮 */
.moon{
  position:fixed;top:42px;right:6vw;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#fff8e0,#ffd98a 55%,#f0a63c);
  pointer-events:none;z-index:1;
  animation:moonBreath 6s ease-in-out infinite;
}
@keyframes moonBreath{
  0%,100%{box-shadow:0 0 60px 10px rgba(255,190,90,.32),0 0 140px 40px rgba(255,150,40,.13)}
  50%{box-shadow:0 0 80px 18px rgba(255,200,110,.5),0 0 190px 70px rgba(255,150,40,.22)}
}
.moon::before,.moon::after{content:'';position:absolute;border-radius:50%;background:rgba(190,130,60,.22)}
.moon::before{width:26px;height:26px;top:26px;left:24px}
.moon::after{width:16px;height:16px;bottom:28px;right:26px}

/* 蜘蛛 */
.spider-thread{
  position:fixed;top:0;left:14%;width:1px;height:130px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));
  transform-origin:top center;
  animation:swing 7s ease-in-out infinite;
}
.spider{position:absolute;bottom:-16px;left:50%;font-size:22px;transform:translateX(-50%);
        filter:drop-shadow(0 0 8px rgba(0,0,0,.9))}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

/* 飄浮裝飾 */
.floaty{position:fixed;pointer-events:none;z-index:1;opacity:.75;user-select:none}
.f-ghost1{top:22%;left:5%;font-size:42px;animation:floatUp 9s ease-in-out infinite}
.f-ghost2{top:66%;right:6%;font-size:34px;animation:floatUp 11s ease-in-out infinite reverse}
.f-pump1{top:48%;left:2%;font-size:38px;animation:bob 5s ease-in-out infinite}
.f-pump2{top:82%;left:80%;font-size:30px;animation:bob 6.5s ease-in-out infinite .8s}
@keyframes floatUp{
  0%,100%{transform:translateY(0) rotate(-4deg);opacity:.55}
  50%{transform:translateY(-28px) rotate(4deg);opacity:.9}
}
@keyframes bob{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-16px) scale(1.06)}
}

/* 蝙蝠 */
.bat{position:fixed;font-size:24px;opacity:.7;pointer-events:none;z-index:1;
     animation:fly 8s ease-in-out infinite}
@keyframes fly{
  0%{transform:translate(0,0) rotate(-6deg)}
  50%{transform:translate(34px,-26px) rotate(8deg)}
  100%{transform:translate(0,0) rotate(-6deg)}
}

/* ===== Header ===== */
header{position:relative;z-index:3;text-align:center;padding:88px 6vw 30px}
.eyebrow{
  font-size:12px;letter-spacing:6px;color:#9b83bd;text-transform:uppercase;margin-bottom:18px;
  animation:fadeDown .9s .1s both;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

h1{
  font-size:clamp(44px,8.5vw,104px);
  letter-spacing:3px;line-height:1;font-weight:900;
  filter:drop-shadow(0 0 22px rgba(255,120,20,.45));
}
h1 .letter{
  display:inline-block;opacity:0;
  transform:translateY(40px) rotate(-10deg) scale(.8);
  animation:letterIn .8s cubic-bezier(.2,.85,.3,1.25) forwards;
}
h1 .letter.accent{
  color:var(--orange);
  animation:letterIn .8s cubic-bezier(.2,.85,.3,1.25) forwards, glowPulse 2.6s ease-in-out infinite 1s;
}
@keyframes letterIn{to{opacity:1;transform:none}}
@keyframes glowPulse{
  0%,100%{text-shadow:0 0 14px rgba(255,140,30,.9),0 0 40px rgba(255,90,0,.55)}
  50%{text-shadow:0 0 22px rgba(255,180,70,1),0 0 70px rgba(255,110,0,.85)}
}

.sub{
  margin-top:20px;color:#c7b3e0;font-size:clamp(13px,1.6vw,16px);letter-spacing:5px;
  animation:fadeDown 1s .8s both;
}
.scroll-hint{
  margin-top:34px;font-size:12px;letter-spacing:3px;color:#8a78a8;
  animation:fadeDown 1s 1.1s both, bobHint 2.4s ease-in-out infinite 1.6s;
}
@keyframes bobHint{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

/* ===== 卡片 ===== */
.grid{
  position:relative;z-index:3;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
  gap:24px;max-width:1280px;margin:0 auto;padding:26px 6vw 40px;
}

.card{
  position:relative;display:block;border-radius:20px;text-decoration:none;color:inherit;
  perspective:900px;opacity:0;
  transition:border-color .3s, box-shadow .3s;
  border:1px solid rgba(255,160,60,.22);
  box-shadow:0 10px 28px rgba(0,0,0,.5);
  background:rgba(255,255,255,.03);
}
.card.in{animation:cardIn .85s cubic-bezier(.2,.85,.3,1.05) forwards}
@keyframes cardIn{
  from{opacity:0;transform:translateY(48px) scale(.94)}
  to{opacity:1;transform:none}
}
.card:hover{
  border-color:rgba(255,175,70,.9);
  box-shadow:0 0 34px rgba(255,140,40,.45),0 20px 50px rgba(255,100,10,.32),0 0 0 1px rgba(255,175,70,.55) inset;
  z-index:5;
}

.card .inner{
  position:relative;border-radius:20px;overflow:hidden;
  transform-style:preserve-3d;
  transition:transform .3s cubic-bezier(.2,.8,.3,1);
  will-change:transform;
  background:linear-gradient(180deg,rgba(30,12,52,.9),rgba(14,6,26,.95));
}
.card:hover .inner{transform:translateY(-9px)}

.thumb{position:relative;aspect-ratio:4/3;overflow:hidden}
.thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .6s cubic-bezier(.2,.8,.3,1), filter .4s;
  filter:saturate(.9) contrast(1.02);
}
.card:hover .thumb img{transform:scale(1.1);filter:saturate(1.15) contrast(1.06)}

.tag{
  position:absolute;top:11px;left:11px;z-index:3;
  font-size:11px;font-weight:700;letter-spacing:1px;
  padding:4px 10px;border-radius:999px;
  background:rgba(10,3,20,.62);border:1px solid rgba(255,170,80,.5);
  color:#ffcf8f;backdrop-filter:blur(6px);
}

.meta{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,120,20,.05));
}
.name{font-size:15px;font-weight:700;letter-spacing:1px}
.no{
  font-size:11.5px;font-weight:800;color:var(--orange-soft);
  border:1px solid rgba(255,160,60,.5);border-radius:8px;padding:2px 9px;
  animation:noPulse 3s ease-in-out infinite;
}
@keyframes noPulse{
  0%,100%{box-shadow:0 0 0 rgba(255,160,60,0)}
  50%{box-shadow:0 0 14px rgba(255,160,60,.45)}
}

.shine{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,210,140,.28) 50%,transparent 62%);
  transform:translateX(-130%);
}
.card:hover .shine{animation:sweep .95s cubic-bezier(.3,.7,.4,1)}
@keyframes sweep{to{transform:translateX(130%)}}

/* ===== Footer 魔法 ===== */
footer{position:relative;z-index:3;text-align:center;padding:20px 6vw 70px}
footer::before{
  content:'';display:block;height:1px;max-width:900px;margin:0 auto 56px;
  background:linear-gradient(90deg,transparent,rgba(255,160,60,.55),rgba(160,43,255,.55),transparent);
}

.magic-zone{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px}

.magic-hint{
  font-size:13px;letter-spacing:5px;color:#b79bd8;
  animation:twinkle 3s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.55;text-shadow:0 0 10px rgba(255,160,60,.2)}
  50%{opacity:1;text-shadow:0 0 20px rgba(255,170,70,.7)}
}

.btn.magic{
  position:relative;display:inline-block;
  padding:18px 40px;border-radius:999px;
  font-size:clamp(14px,1.8vw,17px);font-weight:800;letter-spacing:2px;
  text-decoration:none;color:#fff;overflow:visible;
  background:linear-gradient(135deg,#ff8a1e,#ff2d55 45%,#a02bff 100%);
  background-size:220% 220%;
  animation:magicGradient 6s ease infinite, magicPulse 2.6s ease-in-out infinite;
  transition:transform .3s;
}
.btn.magic:hover{transform:translateY(-4px) scale(1.04)}
.btn.magic:active{transform:translateY(-1px) scale(.99)}

.btn.magic::before{
  content:'';position:absolute;inset:-15px;border-radius:999px;pointer-events:none;
  border:1px dashed rgba(255,185,95,.5);
  animation:spin 16s linear infinite;
}
.btn.magic::after{
  content:'';position:absolute;inset:0;border-radius:999px;pointer-events:none;
  background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);
  background-size:250% 100%;
  animation:magicShine 3.4s ease-in-out infinite;
}
@keyframes magicGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes magicPulse{
  0%{box-shadow:0 0 0 0 rgba(255,140,40,.55),0 16px 44px rgba(255,60,120,.4)}
  70%{box-shadow:0 0 0 28px rgba(255,140,40,0),0 16px 44px rgba(255,60,120,.4)}
  100%{box-shadow:0 0 0 0 rgba(255,140,40,0),0 16px 44px rgba(255,60,120,.4)}
}
@keyframes magicShine{0%{background-position:150% 0}60%,100%{background-position:-150% 0}}
@keyframes spin{to{transform:rotate(360deg)}}

.btn.magic span{position:relative;z-index:2}
.copyright{margin-top:38px;font-size:12px;letter-spacing:2px;color:#6c5c84}

/* ===== Modal ===== */
.modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:3vh 3vw;background:rgba(6,2,12,.85);backdrop-filter:blur(7px);
  opacity:0;visibility:hidden;transition:opacity .32s, visibility .32s;
}
.modal.show{opacity:1;visibility:visible}
.modal-box{
  width:min(1100px,100%);height:92vh;display:flex;flex-direction:column;
  background:#0f0620;border:1px solid rgba(255,160,60,.35);border-radius:18px;
  overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.8),0 0 70px rgba(255,110,20,.2);
  transform:scale(.93) translateY(24px);opacity:0;
  transition:transform .4s cubic-bezier(.2,.9,.3,1.15), opacity .4s;
}
.modal.show .modal-box{transform:none;opacity:1}

.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid rgba(255,160,60,.2);
}
#modalTitle{font-weight:800;color:var(--orange-soft);letter-spacing:1.5px}
.modal-head > div{display:flex;gap:8px}
#modalFrame{flex:1;width:100%;border:0;background:#fff}

.btn.small{
  padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:700;
  letter-spacing:1px;text-decoration:none;cursor:pointer;border:none;
  background:linear-gradient(135deg,#ff7a18,#ff3d00);color:#fff;
  transition:.25s;display:inline-block;
}
.btn.small:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.small.ghost{background:transparent;color:var(--orange-soft);border:1px solid rgba(255,160,60,.5)}
.btn.small.ghost:hover{background:rgba(255,160,60,.14)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
}
</style>
</head>
<body>

<canvas id="sparkles"></canvas>
<div class="spotlight" id="spotlight"></div>
<div class="moon"></div>

<div class="spider-thread"><span class="spider">🕷️</span></div>

<span class="floaty f-ghost1">👻</span>
<span class="floaty f-ghost2">👻</span>
<span class="floaty f-pump1">🎃</span>
<span class="floaty f-pump2">🎃</span>

<span class="bat" style="top:14%;left:8%;animation-duration:7s">🦇</span>
<span class="bat" style="top:28%;left:76%;animation-duration:9.5s">🦇</span>
<span class="bat" style="top:60%;left:4%;animation-duration:11s">🦇</span>
<span class="bat" style="top:76%;left:88%;animation-duration:8.5s">🦇</span>

<header>
  <p class="eyebrow">Lesson 04 · Halloween Workshop</p>
  <h1 id="title">HelloWeen</h1>
  <p class="sub">萬 聖 節 角 色 館 · 九 位 角 色 甦 醒 中</p>
  <p class="scroll-hint">向下滾動 ↓</p>
</header>

<main>
  <div id="grid" class="grid"></div>
</main>

<footer>
  <div class="magic-zone">
    <p class="magic-hint">✦ 全員到齊 · 施展最後的魔法 ✦</p>
    <a class="btn magic" href="Halloween_Workshop_Share.html" target="_blank" rel="noopener">
      <span>📄 開啟 Halloween_Workshop_Share</span>
    </a>
  </div>
  <p class="copyright">© Halloween Workshop · Lesson04</p>
</footer>

<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modalTitle">預覽</span>
      <div>
        <a id="modalOpen" class="btn small" target="_blank" rel="noopener">在新視窗開啟 ↗</a>
        <button id="modalClose" class="btn small ghost" type="button">關閉 ✕</button>
      </div>
    </div>
    <iframe id="modalFrame" title="預覽"></iframe>
  </div>
</div>

<script>
/* ================= 資料 ================= */
const works = [
  { no:1, title:'角色 1', tag:'施工包', img:'Fig (1).png', url:'Fig (1)_施工包/index.html' },
  { no:2, title:'角色 2', tag:'施工包', img:'Fig (2).png', url:'Fig (2)_施工包/index.html' },
  { no:3, title:'角色 3', tag:'工作包', img:'Fig (3).png', url:'Fig (3)工作包/index.html' },
  { no:4, title:'角色 4', tag:'工作包', img:'Fig (4).png', url:'Fig (4)工作包/index.html' },
  { no:5, title:'角色 5', tag:'背景',   img:'Fig (5).png', url:'Fig (5)_施工包-背景/index.html' },
  { no:6, title:'角色 6', tag:'背景',   img:'Fig (6).png', url:'Fig (6)_施工包-背景/index.html' },
  { no:7, title:'角色 7', tag:'背景',   img:'Fig (7).png', url:'Fig (7)_施工包-背景/index.html' },
  { no:8, title:'角色 8', tag:'施工包', img:'Fig (8).png', url:'Fig (8)_施工包/index.html' },
  { no:9, title:'角色 9', tag:'施工包', img:'Fig (9).png', url:'Fig (9)_施工包/index.html' },
];

/* ================= 標題逐字 ================= */
(function splitTitle(){
  const el = document.getElementById('title');
  const word = el.textContent.trim();
  el.textContent = '';
  [...word].forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'letter' + (i >= 5 ? ' accent' : '');
    s.textContent = ch;
    s.style.animationDelay = (0.15 + i * 0.075) + 's';
    el.appendChild(s);
  });
})();

/* ================= 建立卡片 ================= */
const grid = document.getElementById('grid');
const frag = document.createDocumentFragment();

works.forEach((w, i) => {
  const a = document.createElement('a');
  a.className = 'card';
  a.dataset.i = i;
  a.href = encodeURI(w.url);
  a.innerHTML = `
    <div class="inner">
      <span class="tag">${w.tag}</span>
      <div class="thumb">
        <img src="${encodeURI(w.img)}" alt="${w.title}" loading="lazy">
      </div>
      <div class="meta">
        <span class="name">${w.title}</span>
        <span class="no">FIG ${String(w.no).padStart(2,'0')}</span>
      </div>
      <span class="shine"></span>
    </div>`;

  /* 3D 傾斜 */
  const inner = a.querySelector('.inner');
  a.addEventListener('mousemove', e => {
    const r = a.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width  - 0.5;
    const py = (e.clientY - r.top ) / r.height - 0.5;
    inner.style.transform =
      `translateY(-9px) rotateX(${(-py * 9).toFixed(2)}deg) rotateY(${(px * 9).toFixed(2)}deg)`;
  });
  a.addEventListener('mouseleave', () => { inner.style.transform = ''; });

  /* 點擊 → 彈窗 */
  a.addEventListener('click', e => {
    e.preventDefault();
    openModal(w);
  });

  frag.appendChild(a);
});
grid.appendChild(frag);

/* ================= 滾動入場 ================= */
const io = new IntersectionObserver((entries) => {
  entries.forEach(en => {
    if (en.isIntersecting) {
      const card = en.target;
      card.style.animationDelay = ((+card.dataset.i % 9) * 0.07) + 's';
      card.classList.add('in');
      io.unobserve(card);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.card').forEach(c => io.observe(c));

/* ================= Modal ================= */
const modal  = document.getElementById('modal');
const frame  = document.getElementById('modalFrame');
const mTitle = document.getElementById('modalTitle');
const mOpen  = document.getElementById('modalOpen');

function openModal(w){
  mTitle.textContent = `Fig (${w.no}) · ${w.title}`;
  mOpen.href = encodeURI(w.url);
  frame.src  = encodeURI(w.url);
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  modal.classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(() => { frame.src = 'about:blank'; }, 350);
}
document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
});

/* ================= 星光粒子 ================= */
(function sparkles(){
  const cv  = document.getElementById('sparkles');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, P = [];
  const COUNT = window.innerWidth < 700 ? 38 : 72;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width  = W * dpr;
    cv.height = H * dpr;
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function init(){
    P = Array.from({ length: COUNT }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.8 + 0.5,
      vx: (Math.random() - 0.5) * 0.28,
      vy: -Math.random() * 0.42 - 0.08,
      hue: Math.random() < 0.62 ? 32 : 275,
      a: Math.random() * 0.5 + 0.2,
      ph: Math.random() * Math.PI * 2
    }));
  }

  function tick(){
    ctx.clearRect(0, 0, W, H);
    for (const p of P){
      p.x += p.vx;
      p.y += p.vy;
      p.ph += 0.022;

      if (p.y < -20){ p.y = H + 20; p.x = Math.random() * W; }
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;

      const alpha = p.a * (0.55 + 0.45 * Math.sin(p.ph));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
      g.addColorStop(0, `hsla(${p.hue},100%,72%,${alpha})`);
      g.addColorStop(1, `hsla(${p.hue},100%,55%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  resize(); init(); tick();
  addEventListener('resize', () => { resize(); init(); });
})();

/* ================= 滑鼠光暈跟隨 ================= */
(function spotlight(){
  const spot = document.getElementById('spotlight');
  let tx = innerWidth / 2, ty = innerHeight / 2, sx = tx, sy = ty;
  addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
  (function loop(){
    sx += (tx - sx) * 0.08;
    sy += (ty - sy) * 0.08;
    spot.style.transform = `translate(${sx}px, ${sy}px) translate(-50%, -50%)`;
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
