<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 萬聖節像素魔法工作坊 - 施工藍圖</title>
    <style>
        /* 萬聖節主題配色 */
        :root {
            --bg-color: #130821;
            --card-bg: rgba(45, 27, 78, 0.85);
            --accent-orange: #ff7b00;
            --accent-purple: #9d4edd;
            --text-color: #f4f4f9;
            --green: #5c8a3c;
            --white: #f0f0f0;
            --black: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            cursor: none; /* 隱藏預設游標，使用自訂光暈 */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 自訂滑鼠光暈 */
        .cursor-glow {
            position: fixed;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, rgba(255, 123, 0, 0.8) 0%, rgba(255, 123, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: width 0.1s, height 0.1s;
        }

        /* 點擊波紋特效 */
        .click-ripple {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-orange);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9998;
            animation: rippleEffect 0.6s linear forwards;
        }

        @keyframes rippleEffect {
            0% { width: 20px; height: 20px; opacity: 1; }
            100% { width: 100px; height: 100px; opacity: 0; }
        }

        /* 背景漂浮粒子 */
        .particle {
            position: fixed;
            background: var(--accent-orange);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px var(--accent-orange);
            animation: floatUp linear infinite;
            z-index: -1;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* 頁面內容容器 */
        .container {
            max-width: 1000px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: var(--accent-orange);
            text-shadow: 0 0 15px rgba(255, 123, 0, 0.6), 0 0 30px rgba(255, 123, 0, 0.3);
            text-align: center;
            margin-bottom: 5px;
            font-size: 2.5em;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--accent-purple);
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 1.2em;
            text-align: center;
            letter-spacing: 1px;
        }

        /* 控制按鈕區 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--accent-orange);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: none; /* 隱藏預設游標 */
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover, button.active {
            background-color: var(--accent-orange);
            color: #130821;
            box-shadow: 0 0 25px var(--accent-orange);
            transform: translateY(-3px) scale(1.05);
        }

        /* 自動播放按鈕特殊樣式 */
        #autoPlayBtn {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }
        #autoPlayBtn:hover, #autoPlayBtn.playing {
            background-color: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 25px var(--accent-purple);
        }

        /* 圖片顯示區 */
        .image-display {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(157, 78, 221, 0.2);
            text-align: center;
            border: 2px solid #4a2c7a;
            position: relative;
            min-height: 500px; /* 保持高度，避免切換時跳動 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-display img {
            max-width: 100%;
            max-height: 70vh; /* 確保在 16:9 畫面不會爆掉 */
            height: auto;
            border-radius: 8px;
            image-rendering: pixelated; /* 保持像素鋭利度 */
            display: none; 
            transition: transform 0.3s ease;
            cursor: none; 
            opacity: 0;
        }

        /* 圖片切換動畫 */
        .image-display img.active {
            display: block;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 點擊放大特效 */
        .image-display img.zoomed {
            transform: scale(1.6);
            z-index: 20;
            box-shadow: 0 0 40px rgba(255, 123, 0, 0.5);
        }

        .hint {
            font-size: 0.95em;
            color: #a78bfa;
            margin-top: 15px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* 材料清單區 */
        .materials {
            margin-top: 25px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #4a2c7a;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .material-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.5);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }

        .material-item:hover {
            transform: translateY(-2px);
            border-color: var(--accent-orange);
        }

        .swatch {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            border: 1px solid #ffffff50;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .swatch.green { background-color: var(--green); }
        .swatch.white { background-color: var(--white); }
        .swatch.black { background-color: var(--black); }

        /* 隱藏預設游標在某些瀏覽器上的問題 */
        a, button, img {
            -webkit-user-drag: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- 自訂滑鼠光暈 -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="container">
        <h1>🎃 像素魔法工作坊</h1>
        <p class="subtitle">萬聖節背景施工藍圖 (尺寸: 32×32)</p>

        <!-- 切換按鈕區 -->
        <div class="controls">
            <button onclick="showImage('整圖藍圖', this)" class="active">整圖藍圖</button>
            <button onclick="showImage('區塊1-1', this)">區塊 1-1</button>
            <button onclick="showImage('區塊1-2', this)">區塊 1-2</button>
            <button onclick="showImage('區塊2-1', this)">區塊 2-1</button>
            <button onclick="showImage('區塊2-2', this)">區塊 2-2</button>
            <button id="autoPlayBtn" onclick="toggleAutoPlay(this)">▶ 自動展示</button>
        </div>

        <!-- 圖片顯示區 -->
        <div class="image-display" onclick="toggleZoom(event)">
            <img id="img-整圖藍圖" class="active" src="整圖藍圖.png" alt="整圖藍圖">
            <img id="img-區塊1-1" src="區塊1-1.png" alt="區塊1-1">
            <img id="img-區塊1-2" src="區塊1-2.png" alt="區塊1-2">
            <img id="img-區塊2-1" src="區塊2-1.png" alt="區塊2-1">
            <img id="img-區塊2-2" src="區塊2-2.png" alt="區塊2-2">
        </div>
        <p class="hint">💡 提示：點擊圖片可以放大查看細節</p>

        <!-- 材料統計 -->
        <div class="materials">
            <div class="material-item">
                <div class="swatch green"></div>
                <span>綠色混凝土: 506 個</span>
            </div>
            <div class="material-item">
                <div class="swatch white"></div>
                <span>白色羊毛: 191 個</span>
            </div>
            <div class="material-item">
                <div class="swatch black"></div>
                <span>黑色羊毛: 295 個</span>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯控制 -->
    <script>
        // 1. 自訂滑鼠光暈跟隨
        const cursorGlow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        // 2. 滑鼠點擊波紋特效
        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.classList.add('click-ripple');
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            
            // 動畫結束後移除元素
            setTimeout(() => {
                ripple.remove();
            }, 600);
        });

        // 3. 產生背景漂浮粒子 (萬聖節螢火蟲)
        function createParticles() {
            const particleCount = 30; // 粒子數量
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // 隨機大小、位置、動畫時間
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's'; // 5到10秒
                particle.style.animationDelay = Math.random() * 5 + 's';
                
                document.body.appendChild(particle);
            }
        }
        createParticles();

        // 4. 圖片切換邏輯
        let autoPlayInterval = null;
        const imageNames = ['整圖藍圖', '區塊1-1', '區塊1-2', '區塊2-1', '區塊2-2'];
        let currentIndex = 0;

        function showImage(imageName, btnElement) {
            // 停止自動播放 (如果使用者手動點擊)
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
                document.getElementById('autoPlayBtn').classList.remove('playing');
                document.getElementById('autoPlayBtn').innerText = '▶ 自動展示';
            }

            // 隱藏所有圖片並移除放大狀態
            const images = document.querySelectorAll('.image-display img');
            images.forEach(img => {
                img.classList.remove('active');
                img.classList.remove('zoomed');
            });

            // 移除所有按鈕的 active 狀態
            const buttons = document.querySelectorAll('.controls button:not(#autoPlayBtn)');
            buttons.forEach(btn => btn.classList.remove('active'));

            // 顯示目標圖片
            const targetImg = document.getElementById('img-' + imageName);
            if (targetImg) {
                targetImg.classList.add('active');
            }

            // 設定點擊的按鈕為 active
            if (btnElement) {
                btnElement.classList.add('active');
            }

            // 記錄當前索引，方便自動播放對接
            currentIndex = imageNames.indexOf(imageName);
        }

        // 5. 圖片放大/縮小功能
        function toggleZoom(event) {
            if (event.target.tagName === 'IMG' && !autoPlayInterval) {
                // 如果正在自動播放，點擊時先停止播放，再放大
                event.target.classList.toggle('zoomed');
            }
        }

        // 6. 自動展示模式
        function toggleAutoPlay(btn) {
            if (autoPlayInterval) {
                // 停止播放
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
                btn.classList.remove('playing');
                btn.innerText = '▶ 自動展示';
            } else {
                // 開始播放
                btn.classList.add('playing');
                btn.innerText = '⏸ 停止展示';
                
                // 確保目前是從放大狀態恢復
                document.querySelectorAll('.image-display img').forEach(img => img.classList.remove('zoomed'));

                autoPlayInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % imageNames.length;
                    const nextImageName = imageNames[currentIndex];
                    
                    // 尋找對應的按鈕 (跳過自動播放按鈕)
                    const buttons = document.querySelectorAll('.controls button:not(#autoPlayBtn)');
                    let targetBtn = null;
                    buttons.forEach(b => {
                        if (b.innerText.includes(nextImageName.replace('整圖', '整圖').replace('區塊', '區塊'))) {
                            targetBtn = b;
                        }
                    });

                    // 呼叫切換函數 (不傳入 btnElement 避免觸發停止)
                    // 這裡直接操作 DOM 避免觸發停止邏輯
                    const images = document.querySelectorAll('.image-display img');
                    images.forEach(img => img.classList.remove('active', 'zoomed'));
                    buttons.forEach(b => b.classList.remove('active'));

                    document.getElementById('img-' + nextImageName).classList.add('active');
                    if (targetBtn) targetBtn.classList.add('active');

                }, 3000); // 每 3 秒切換一次
            }
        }
    </script>
</body>
</html>
